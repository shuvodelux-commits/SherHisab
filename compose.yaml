services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: sherhisab
      POSTGRES_USER: sherhisab
      POSTGRES_PASSWORD: sherhisab
    ports:
      - "5432:5432"
    volumes:
      - sherhisab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherhisab -d sherhisab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sherhisab_postgres_data:
