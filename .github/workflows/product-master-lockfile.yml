name: Product Master Lockfile Helper

on:
  push:
    branches:
      - impl/product-master-phase2
    paths:
      - apps/web/package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: impl/product-master-phase2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh product ui lockfile"
          git push origin HEAD:impl/product-master-phase2
