name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://sherhisab:sherhisab@localhost:5432/sherhisab

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sherhisab
          POSTGRES_USER: sherhisab
          POSTGRES_PASSWORD: sherhisab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sherhisab -d sherhisab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.26.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
