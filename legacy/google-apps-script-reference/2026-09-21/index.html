  <!--

        <!-- Scratchpad calculator, opened over whichever page is on screen.
             wireCalcPanel_() in javascript.html owns the toggle/outside-click/

        <button id="calcToggleBtn" class="icon-btn" title="Calculator" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="2" width="16" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="12" cy="11" r="1" fill="currentColor"/><circle cx="16.5" cy="11" r="1" fill="currentColor"/><circle cx="7.5" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16.5" cy="15" r="1" fill="currentColor"/><circle cx="7.5" cy="19" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/><rect x="14.3" y="17" width="3.5" height="4" rx="0.6" fill="currentColor"/></svg>
        </button>
        <!-- One Refresh button for the whole app. Each page registers its own
             loader via registerPageReload(), so this works everywhere without
             a button being added to every page file. -->
        <button id="refreshBtn" class="icon-btn" title="Refresh this page" onclick="refreshCurrentPage()">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 11a8 8 0 1 0-.6 3M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Refresh</span>
        </button>
      </header>

      <main class="content" id="content">

             Settings > General/Users/Roles). javascript.html fills this in
             from NAV_ITEMS on every page change and hides it when the
             current module has no children, so no page file needs to know
             it exists. -->
        <div class="tabs" id="subNav" hidden></div>

        <section class="page" id="page-noAccess" data-page="noAccess" hidden>
          <div class="card"><h3>No access</h3><p>You do not have permission to open any module. Ask an administrator to assign a role permission.</p></div>

        <section class="page" id="page-products" data-page="products" hidden>
          <?!= include('products'); ?>
        </section>
        <section class="page" id="page-customers" data-page="customers" hidden>

        <section class="page" id="page-customerLedger" data-page="customerLedger" hidden>

        </section>
        <section class="page" id="page-reports" data-page="reports" hidden>
          <?!= include('reports'); ?>
        </section>
        <section class="page" id="page-settings" data-page="settings" hidden>

        </section>
        <section class="page" id="page-invoiceDesign" data-page="invoiceDesign" hidden>

        <section class="page" id="page-bank" data-page="bank" hidden>

    <!-- Phone/PWA navigation. Visibility is CSS-controlled and the actual
         destinations are permission-filtered from the same NAV_ITEMS as the
         desktop sidebar. -->
    <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Primary mobile navigation">
      <button type="button" class="mobile-nav-item" data-mobile-page="dashboard" onclick="goToPage('dashboard')"><span class="mobile-nav-icon" data-mobile-icon="dashboard"></span><span>Dashboard</span></button>
      <button type="button" class="mobile-nav-item" data-mobile-page="pos" onclick="goToPage('pos')"><span class="mobile-nav-icon" data-mobile-icon="pos"></span><span>POS</span></button>
      <button type="button" class="mobile-nav-item" data-mobile-page="sales" onclick="goToPage('sales')"><span class="mobile-nav-icon" data-mobile-icon="sales"></span><span>Sales</span></button>
      <button type="button" class="mobile-nav-item" data-mobile-page="products" onclick="goToPage('products')"><span class="mobile-nav-icon" data-mobile-icon="products"></span><span>Products</span></button>
      <button type="button" class="mobile-nav-item" data-mobile-page="more" onclick="openMobileMore_()"><span class="mobile-nav-more-icon" aria-hidden="true">•••</span><span>More</span></button>
    </nav>

    <div id="mobileMoreSheet" class="mobile-more-overlay" hidden>
      <button type="button" class="mobile-more-backdrop" aria-label="Close menu" onclick="closeMobileMore_()"></button>
      <section class="mobile-more-sheet" role="dialog" aria-modal="true" aria-labelledby="mobileMoreTitle">
        <div class="mobile-sheet-handle" aria-hidden="true"></div>
        <div class="mobile-more-header">
          <div><h3 id="mobileMoreTitle">More</h3><span class="bn-hint">সব মডিউল</span></div>
          <button type="button" class="modal-close mobile-sheet-close" onclick="closeMobileMore_()" aria-label="Close">&#10005;</button>
        </div>
        <div id="mobileMoreList" class="mobile-more-list"></div>
      </section>
    </div>

  </div>

  <!-- Global confirmation safety layer. Lives outside #app so it remains
       visible regardless of which SPA page section is hidden. -->
  <div class="confirm-action-overlay" id="confirmActionModal" hidden>
    <section class="confirm-action-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmActionTitle">
      <div class="confirm-action-header">
        <h3 id="confirmActionTitle">Confirm action</h3>
        <button type="button" class="modal-close" id="confirmActionClose" aria-label="Cancel">&#10005;</button>
      </div>
      <div class="confirm-action-body">
        <p id="confirmActionMessage" class="confirm-action-message"></p>
        <div id="confirmActionDetails" class="confirm-action-details"></div>
        <label class="field confirm-action-reason" id="confirmActionReasonRow" hidden>
          <span id="confirmActionReasonLabel">Reason</span>
          <textarea id="confirmActionReason" rows="3" maxlength="200" placeholder="Enter reason..."></textarea>
          <span class="field-error" id="confirmActionReasonError"></span>
        </label>
      </div>
      <div class="confirm-action-footer">
        <button type="button" class="btn" id="confirmActionCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmActionConfirm">Confirm</button>
      </div>
    </section>
  </div>

  <!-- Off-screen host for one-page printing (invoices and ledger ranges). -->
  <div id="printHost"></div>

  <!-- Desktop-friendly floating horizontal scrollbar. It is synced by javascript.html
       with the currently relevant wide table/list so horizontal scrolling never
       requires reaching the bottom of a long page. -->
  <div id="floatingHScroll" class="floating-hscroll" hidden aria-label="Horizontal scroll">
    <div id="floatingHScrollInner"></div>
  </div>

  <!-- Scratchpad calculator panel. Lives outside #app, like the other shared
       overlays below, so it floats above whichever page is on screen instead
       of being one more thing every page file has to include. -->
  <div id="calcPanel" class="calc-panel" hidden>
    <div class="calc-panel-header">
      <h3>Calculator</h3>
      <div class="calc-panel-actions">
        <button type="button" class="calc-clear-btn" id="calcClearBtn" title="Clear all lines">Clear</button>
        <button type="button" class="modal-close" id="calcCloseBtn" aria-label="Close calculator">&#10005;</button>
      </div>
    </div>
    <div class="calc-lines" id="calcLines"></div>
    <div class="calc-total-row">
      <span>Total</span>
      <span class="calc-total-value" id="calcTotalValue">0</span>
    </div>
    <!-- Touch keypad. A single delegated listener in wireCalcKeypad_() (javascript.html)
         reads data-action/data-value off whichever button was tapped, so this grid
         never needs per-button wiring or a rebuild. Typing on a real keyboard still
         works on the line inputs above — this is an alternative input, not a replacement. -->
    <div class="calc-keypad" id="calcKeypad">
      <button type="button" class="calc-key calc-key-fn" data-action="paren-open">(</button>
      <button type="button" class="calc-key calc-key-fn" data-action="paren-close">)</button>
      <button type="button" class="calc-key calc-key-fn" data-action="backspace" aria-label="Backspace">&#9003;</button>
      <button type="button" class="calc-key calc-key-fn" data-action="clear-line">C</button>

      <button type="button" class="calc-key" data-action="digit" data-value="7">7</button>
      <button type="button" class="calc-key" data-action="digit" data-value="8">8</button>
      <button type="button" class="calc-key" data-action="digit" data-value="9">9</button>
      <button type="button" class="calc-key calc-key-op" data-action="op" data-value="&#247;">&#247;</button>

      <button type="button" class="calc-key" data-action="digit" data-value="4">4</button>
      <button type="button" class="calc-key" data-action="digit" data-value="5">5</button>
      <button type="button" class="calc-key" data-action="digit" data-value="6">6</button>
      <button type="button" class="calc-key calc-key-op" data-action="op" data-value="&#215;">&#215;</button>

      <button type="button" class="calc-key" data-action="digit" data-value="1">1</button>
      <button type="button" class="calc-key" data-action="digit" data-value="2">2</button>
      <button type="button" class="calc-key" data-action="digit" data-value="3">3</button>
      <button type="button" class="calc-key calc-key-op" data-action="op" data-value="-">&#8722;</button>

      <button type="button" class="calc-key calc-key-fn" data-action="percent">%</button>
      <button type="button" class="calc-key" data-action="digit" data-value="0">0</button>
      <button type="button" class="calc-key" data-action="digit" data-value=".">.</button>
      <button type="button" class="calc-key calc-key-op" data-action="op" data-value="+">+</button>

      <button type="button" class="calc-key calc-key-equals" data-action="equals">=</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="loader" class="loader-overlay" hidden><div class="spinner"></div></div>

  <?!= include('javascript'); ?>
</body>
</html>
