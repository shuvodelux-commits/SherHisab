<style>
  :root{
    --color-bg: #f5f6f8;
    --color-surface: #ffffff;
    --color-border: #e4e7ec;
    --color-text: #172033;
    --color-text-muted: #667085;
    --color-primary: #1a56db;
    --color-primary-dark: #123fae;
    --color-primary-light: #eaf1ff;
    --color-success: #12805c;
    --color-success-light: #e8f6f1;
    --color-danger: #c0342c;
    --color-danger-light: #fbebea;
    --color-warning: #b5650d;
    --color-warning-light: #fdf1e3;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow-md: 0 8px 24px rgba(15,23,42,.10);
    --sidebar-width: 240px;
    --sidebar-collapsed-width: 68px;
    --topbar-height: 60px;
    --app-viewport-height: 100dvh;
    --mobile-nav-clearance: 0px;
    --font-sans: "Inter", "Noto Sans Bengali", "Segoe UI", Arial, sans-serif;
    --font: var(--font-sans);
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    /* Noto Sans Bengali is loaded as a webfont so Bangla stays consistent
       across Windows, Android, ChromeOS and macOS. System fonts remain as
       offline fallbacks. Mirrored as RECEIPT_FONT_STACK in javascript.html
       for the canvas receipt. */
    --font-bn: "Noto Sans Bengali", "Nirmala UI", "Shonar Bangla", Vrinda,
               "Kohinoor Bangla", "Bangla Sangam MN", "Bangla MN",
               SolaimanLipi, Kalpurush, "Siyam Rupali", var(--font-sans);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0 0 4px; font-weight: 700; letter-spacing: -.01em; }
  p { line-height: 1.5; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  #app { display: flex; min-height: 100vh; }
  #app[hidden] { display: none; }

  /* ---------------- Wide-table horizontal scroll containment (new; doesn't touch .card/.table/.toolbar) ---------------- */
.table-scroll { overflow-x: auto; }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 16px;
    border-bottom: 1px solid var(--color-border);
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--color-primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    font-family: var(--font-mono);
  }
  .shop-name { font-weight: 600; font-size: 14px; line-height: 1.3; }

  .nav-list { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-divider { height: 1px; margin: 10px 8px; background: var(--color-border); opacity: .9; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; margin-bottom: 2px;
    border-radius: 8px; cursor: pointer;
    color: var(--color-text-muted); font-size: 14px; font-weight: 500;
    user-select: none;
  }
  .nav-item:hover { background: var(--color-bg); color: var(--color-text); }
  .nav-item.active { background: var(--color-primary-light); color: var(--color-primary-dark); }
  .nav-item svg { flex-shrink: 0; }
  .nav-item-text { display: flex; flex-direction: column; min-width: 0; }

  /* ---------------- Bangla helper text under menu/page labels (sidebar,
     sub-nav tabs, topbar title, ledger headers) — always small, muted and
     secondary to the English label next to it, regardless of hover/active
     state on the parent. ---------------- */
  .bn-hint { display: block; font-family: var(--font-bn); font-size: 11px; font-weight: 400; color: var(--color-text-muted); line-height: 1.3; }
  .sidebar-footer {
    padding: 12px 16px; font-size: 11px; color: var(--color-text-muted);
    border-top: 1px solid var(--color-border);
  }

  /* ---------------- Topbar ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: var(--topbar-height); flex-shrink: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px; background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-date {
    position: relative; margin-left: auto; flex-shrink: 0;
    font-size: 13px; color: var(--color-text-muted); white-space: nowrap;
  }
  .topbar-date-toggle {
    min-height: 32px; padding: 5px 7px; border: 0; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    background: transparent; color: inherit; font: 500 13px/1 var(--font-mono);
  }
  .topbar-date-toggle:hover, .topbar-date-toggle:focus-visible, .topbar-date.is-open .topbar-date-toggle {
    background: var(--color-bg); outline: none;
  }
  .topbar-date-chevron { flex: 0 0 auto; transition: transform .15s ease; }
  .topbar-date.is-open .topbar-date-chevron { transform: rotate(180deg); }
  .topbar-date-popover {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 1700;
    min-width: 230px; padding: 8px; border: 1px solid var(--color-border); border-radius: 10px;
    background: var(--color-surface); box-shadow: 0 12px 30px rgba(15,23,42,.16);
  }
  .topbar-date-popover[hidden] { display: none; }
  .topbar-date-row {
    min-height: 34px; padding: 5px 7px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
    border-radius: 7px; font-family: var(--font-bn);
  }
  .topbar-date-row + .topbar-date-row { border-top: 1px solid var(--color-border); border-radius: 0 0 7px 7px; }
  .topbar-date-label { color: var(--color-text-muted); font-size: 12px; font-weight: 500; }
  #banglaDateView { color: #7c3aed; font-family: var(--font-bn); font-weight: 700; }
  #arabicDateView { color: #0f766e; font-family: var(--font-bn); font-weight: 700; }
  .icon-btn {
    border: none; background: transparent; cursor: pointer;
    color: var(--color-text-muted); padding: 6px; border-radius: 6px;
    display: none;
  }
  .icon-btn:hover { background: var(--color-bg); }
  #menuToggle { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sidebar-collapse-btn {
    display: none;
    margin-left: auto;
    width: 30px; height: 30px; padding: 4px; flex-shrink: 0;
    align-items: center; justify-content: center;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text-muted);
    border-radius: 8px;
  }
  .sidebar-collapse-btn:hover { color: var(--color-text); background: var(--color-primary-light); }

  /* The app-wide Refresh button. Was display:none from the shared .icon-btn
     rule above except inside the <=860px media query, so it only ever
     appeared on mobile. An ID selector outranks that .icon-btn class rule
     at any width, so this holds regardless of screen size. Styled like the
     page-level "Refresh" buttons (.btn-primary) rather than as a bare icon,
     per request, and pinned to the right of the topbar the same way
     .topbar-date already was. */
  #refreshBtn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: 0; padding: 8px 14px; border-radius: var(--radius-sm);
    background: var(--color-primary); color: #fff; font-size: 13px; font-weight: 600;
  }
  #refreshBtn:hover { background: var(--color-primary-dark); }
  #refreshBtn span { white-space: nowrap; }

  /* Calculator toggle — same always-visible override as #refreshBtn above
     (an ID selector outranks the <=860px-only .icon-btn rule), kept as a
     bare icon since it doesn't carry a text label. */
  #calcToggleBtn { display: inline-flex; align-items: center; justify-content: center; }
  #calcToggleBtn.is-active { background: var(--color-primary-light); color: var(--color-primary-dark); }

  /*This Change all module okay*/
  .content { flex: 1; padding: 24px; overflow-y: auto; overflow-x: hidden; }
  .page[hidden] { display: none; }

  /* ---------------- Reusable building blocks ---------------- */
  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm);
  }

  .stat-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    margin-bottom: 20px;
  }
  .stat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 14px; }
  .stat-label { font-size: 11px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .035em; }
  .stat-value { font-size: 22px; line-height: 1.15; font-weight: 700; margin-top: 5px; font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  .placeholder-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 8px; padding: 60px 20px; color: var(--color-text-muted);
  }
  .placeholder-card h3 { color: var(--color-text); margin: 0; font-size: 16px; }
  .placeholder-card p { margin: 0; font-size: 13px; max-width: 380px; }
  .phase-tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--color-primary-dark); background: var(--color-primary-light);
    padding: 3px 10px; border-radius: 999px; margin-bottom: 4px;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text); padding: 9px 16px; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font);
  }
  .btn:hover { background: var(--color-bg); }
  .btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-dark); }
  .btn-lg { padding: 16px 20px; font-size: 16px; border-radius: 10px; }

  input, select, textarea {
    font-family: var(--font); font-size: 14px;
    border: 1px solid var(--color-border); border-radius: 8px;
    padding: 9px 12px; width: 100%; background: var(--color-surface); color: var(--color-text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light);
  }
  label { font-size: 13px; font-weight: 600; color: var(--color-text-muted); display: block; margin-bottom: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
  th { color: var(--color-text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  td.num, th.num { text-align: right; font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge-success { background: var(--color-success-light); color: var(--color-success); }
  .badge-danger { background: var(--color-danger-light); color: var(--color-danger); }
  .badge-warning { background: var(--color-warning-light); color: var(--color-warning); }

  /* ---------------- Page toolbar / search ---------------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar .search-input { max-width: 320px; }
  .toolbar-spacer { flex: 1; }
  .smart-search-box { position: relative; width: 100%; }
  .smart-search-box .search-input { width: 100%; padding-right: 42px; }

  /* One search-clear treatment across the ERP. Suppress browser-native
     cancel decorations so Windows/Chrome/Edge cannot draw their own blue
     clear block on top of the product/counter search UX. */
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration {
    -webkit-appearance: none; appearance: none; display: none;
  }
  input[type="search"]::-ms-clear { display: none; width: 0; height: 0; }

  .erp-search-clear-field, .erp-search-clear-host { position: relative; min-width: 0; }
  .erp-search-clear-field { display: block; }
  .erp-search-clear-field > input,
  .erp-search-clear-host > input { width: 100%; padding-right: 42px !important; }
  .toolbar > .erp-search-clear-field { flex: 0 1 320px; max-width: 320px; }

  .smart-search-clear, .erp-search-clear {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; min-height: 0 !important; padding: 0;
    border: 0; border-radius: 6px; background: transparent;
    color: var(--color-text-muted); cursor: pointer;
    font: 500 16px/1 var(--font-sans); box-shadow: none;
  }
  .smart-search-clear:hover, .smart-search-clear:focus,
  .erp-search-clear:hover, .erp-search-clear:focus {
    background: transparent; color: var(--color-primary-dark); box-shadow: none;
  }
  .smart-search-clear:focus-visible, .erp-search-clear:focus-visible {
    outline: 1px solid var(--color-primary); outline-offset: -3px;
  }
  .toolbar .prod-search-box { width: min(100%, 320px); flex: 0 1 320px; }

  /* Products table sorting follows the light, text-first header treatment:
     the header remains visually a table label rather than becoming a button. */
  .prod-sort-button {
    appearance: none; display: inline-flex; align-items: center; gap: 5px;
    min-height: 0; padding: 0; border: 0; background: transparent;
    color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit;
    cursor: pointer; white-space: nowrap;
  }
  .prod-sort-th .prod-sort-button { margin-left: auto; justify-content: flex-end; }
  .prod-sort-indicator {
    display: inline-block; min-width: 10px; color: var(--color-text-muted);
    font-size: 10px; font-weight: 700; line-height: 1; opacity: .5;
  }
  .prod-sort-button:hover, .prod-sort-button:focus-visible { color: var(--color-text); outline: none; }
  .prod-sort-button:hover .prod-sort-indicator, .prod-sort-button:focus-visible .prod-sort-indicator { opacity: .8; }
  .prod-sort-button.is-active { color: var(--color-text); font-weight: 700; }
  .prod-sort-button.is-active .prod-sort-indicator { color: var(--color-primary); opacity: 1; }

  /* ---------------- Searchable combobox (type-to-filter text input +
     option list) — e.g. purchase.html's Add Product pickers.

     .combo-row pins align-items to center explicitly (rather than
     flexbox's default 'stretch') and .combo-row .btn is flex-shrink:0 +
     nowrap, so the button next to the input can never be squeezed or
     stretched by anything happening in its sibling. .combo-wrap itself is
     min-width:0 — without it, a flex item wrapping a text input can be
     forced wider than its actual share of the row (a standard flexbox
     trap), pushing the button out and deforming the row. .combo-list is
     always position:absolute (out of normal flow), so opening/expanding/
     scrolling the dropdown itself can never shift surrounding layout —
     these rules only guard the row that's left once it's closed. ---------------- */
  .combo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .combo-row .btn { flex-shrink: 0; white-space: nowrap; }
  .combo-wrap { position: relative; flex: 1; min-width: 0; }
  .combo-wrap input:disabled { opacity: .6; cursor: not-allowed; }
  .combo-list {
    position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    max-height: 240px; overflow-y: auto; padding: 4px;
  }
  .combo-list[hidden] { display: none; }
  .combo-option { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .combo-option:hover, .combo-option.active { background: var(--color-primary-light); color: var(--color-primary-dark); }
  .combo-option-meta { margin-top: 2px; font-size: 11px; color: var(--color-text-muted); }
  .combo-option.active .combo-option-meta { color: inherit; opacity: .8; }
  .combo-option-empty { padding: 8px 10px; font-size: 13px; color: var(--color-text-muted); }

  /* ---------------- Tabs ---------------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); margin-bottom: 18px; }
  .tab-btn {
    border: none; background: transparent; cursor: pointer; padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: var(--color-text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font);
  }
  .tab-btn.active { color: var(--color-primary-dark); border-bottom-color: var(--color-primary); }
  .tab-panel[hidden] { display: none; }

  /* Sub-tabs under the header for grouped modules (Sales > Invoices /
     Returns, Settings > General / Users / Roles). It carries class="tabs",
     which sets display:flex — and that beats the plain [hidden] attribute,
     so it needs an explicit rule to actually stay hidden. */
  #subNav { margin: 0 0 18px; }
  #subNav[hidden] { display: none; }

  /* ---------------- Forms ---------------- */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field-error { color: var(--color-danger); font-size: 12px; margin-top: 4px; display: none; }

  /* ---------------- Modal ---------------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.4);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 900;
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    background: var(--color-surface); border-radius: var(--radius);
    width: 100%; max-width: 560px; box-shadow: var(--shadow-md);
    max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  }
  .modal.modal-lg { max-width: 900px; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--color-border); flex-shrink: 0;
  }
  .modal-header h3 { font-size: 16px; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-footer {
    padding: 14px 20px; border-top: 1px solid var(--color-border);
    display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0;
  }
  .modal-close { border: none; background: transparent; cursor: pointer; color: var(--color-text-muted); padding: 4px; }

  /* ---------------- Calculator panel ----------------
     A small scratchpad opened from the topbar icon on every page. Fixed
     positioning (like .floating-hscroll further down) keeps it anchored to
     the viewport regardless of whether the current page scrolls, so it
     never has to be re-anchored to the toggle button's live position. */
  .calc-panel {
    position: fixed;
    top: calc(var(--topbar-height) + 10px);
    right: 20px;
    width: 320px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - var(--topbar-height) - 30px);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    z-index: 950;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .calc-panel[hidden] { display: none; }
  .calc-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; flex-shrink: 0;
    background: var(--color-primary); color: #fff;
  }
  .calc-panel-header h3 { font-size: 14px; color: #fff; }
  .calc-panel-actions { display: flex; align-items: center; gap: 12px; }
  .calc-clear-btn {
    border: none; background: transparent; cursor: pointer;
    color: rgba(255,255,255,.85); font-size: 12px; font-weight: 600; padding: 2px 4px;
  }
  .calc-clear-btn:hover { color: #fff; }
  .calc-panel-header .modal-close { color: rgba(255,255,255,.85); }
  .calc-panel-header .modal-close:hover { color: #fff; }

  .calc-lines { overflow-y: auto; padding: 8px 14px; flex: 1 1 auto; min-height: 0; }
  .calc-line { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .calc-line-no {
    flex-shrink: 0; width: 16px; text-align: right;
    font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted);
  }
  .calc-line-input {
    flex: 1; min-width: 0; width: 0; border: none; border-bottom: 1px solid transparent;
    padding: 4px 2px; font-family: var(--font-mono); font-size: 13px;
    background: transparent; color: var(--color-text);
  }
  .calc-line-input:focus { outline: none; border-bottom-color: var(--color-primary); }
  .calc-line-input[readonly] {
    cursor: default;
    caret-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .calc-line-input.has-error { color: var(--color-danger); }
  .calc-line-result {
    flex-shrink: 0; font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    color: var(--color-primary-dark); min-width: 60px; text-align: right;
  }
  .calc-line-remove {
    flex-shrink: 0; border: none; background: transparent; cursor: pointer;
    color: var(--color-text-muted); font-size: 15px; line-height: 1; padding: 2px 4px;
    visibility: hidden;
  }
  .calc-line:hover .calc-line-remove, .calc-line-input:focus ~ .calc-line-remove { visibility: visible; }
  .calc-line-remove:hover { color: var(--color-danger); }

  .calc-total-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-top: 1px solid var(--color-border);
    font-size: 14px; font-weight: 700; flex-shrink: 0;
    background: var(--color-bg);
  }
  .calc-total-value { font-family: var(--font-mono); }

  /* Touch keypad — an alternative to typing directly into a line, for
     touchscreens/kiosks. Grid buttons insert at the active line's cursor
     via calcKeypadInsert_ (javascript.html); '=' behaves like Enter. */
  .calc-keypad {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px 14px 14px; flex-shrink: 0;
    border-top: 1px solid var(--color-border); background: var(--color-bg);
  }
  .calc-key {
    border: none; border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-text);
    font-family: var(--font-mono); font-size: 16px; font-weight: 600;
    padding: 13px 0; cursor: pointer; box-shadow: var(--shadow-sm);
    -webkit-tap-highlight-color: transparent;
  }
  .calc-key:active { background: var(--color-primary-light); }

    background: var(--color-primary); color: #fff; padding: 12px 0;
  }

  @media (max-width: 860px) {

  .c-line-total-wrap { display: flex; align-items: center; justify-content: flex-end; }
  .shortage-choice-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .shortage-vendor-grid { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .shortage-vendor-field { flex: 1; min-width: 140px; }
  .shortage-cost-field { width: 110px; }

  /* Approved mobile module mockup primitives. These remain harmless on

  .pos-customer-input-wrap { position: relative; }
  .pos-customer-input-wrap input { width: 100%; padding-left: 46px; }
  .pos-customer-input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 1; color: #718096; font-size: 20px; line-height: 1; pointer-events: none; }
  .pos-customer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
  .pos-customer-actions .btn { min-width: 0; min-height: 48px; white-space: normal; font-weight: 600; }
  .purchase-add-product { margin-top: 4px; }
  .purchase-filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
  .purchase-filter-field { min-width: 0; }

  .purchase-filter-field select { width: 100%; }
  .purchase-search-row { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 10px; align-items: stretch; margin-top: 12px; }
  .purchase-product-search { min-width: 0; }
  .purchase-product-search input { width: 100%; }
  .purchase-add-icon-btn { width: 54px; min-width: 54px; padding: 0; font-size: 28px; font-weight: 700; line-height: 1; }
  .cart-row .c-price-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cart-row .c-price-wrap input { width: 100% !important; box-sizing: border-box; }
  .cart-row .c-reset-lot-price {
    border: 0; background: transparent; padding: 0; cursor: pointer;
    color: var(--color-primary); font-size: 9px; line-height: 1.1; text-align: center; white-space: nowrap;
  }
  /* Purchase Price Visibility — the resting state is a faint dot sitting
     next to the unit, small and quiet enough to pass for punctuation from
     across a counter. It only carries a figure while revealed (see
     posCostMarkerHtml_ in pos.html), which is when it earns the contrast. */
  .cart-row .c-cost {
    border: none; background: transparent; padding: 0 3px; margin-left: 2px; cursor: pointer;
    font-family: var(--font-mono); font-size: 11px; line-height: 1; vertical-align: baseline;
    color: var(--color-text-muted); opacity: .45; border-radius: 4px;
  }
  .cart-row .c-cost:hover { opacity: .75; }
  .cart-row .c-cost.is-revealed {
    opacity: 1; padding: 1px 5px; font-weight: 600;
  }
  .cart-remove { border: none; background: transparent; color: var(--color-danger); cursor: pointer; font-size: 16px; }
  .totals-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .totals-row.grand { font-size: 18px; font-weight: 700; border-top: 1px solid var(--color-border); padding-top: 10px; margin-top: 6px; }
  .totals-row .v { font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  .payment-types { display: flex; gap: 8px; margin: 10px 0; }
  .payment-types label {
    flex: 1; text-align: center; border: 1px solid var(--color-border); border-radius: 8px;
    padding: 9px 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--color-text-muted);
    margin: 0;
  }
  .payment-types input { display: none; }
  .payment-types input:checked + span { color: var(--color-primary-dark); }
  .payment-types label:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary-dark); }

  /* ---------------- Module-scoped overrides — do not touch the shared .cart-remove / .btn classes above ---------------- */
.cart-row .cart-remove {
  align-self: center; flex-shrink: 0; width: 28px; height: 28px; padding: 0;
  display: flex; align-items: center; justify-content: center;
}
#smTableBody .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------------- Cash session banner ---------------- */
  .session-banner {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 18px;
    border: 1px solid var(--color-border);
  }
  .session-banner.is-open { background: var(--color-success-light); border-color: #b7e4d3; }
  .session-banner.is-closed { background: var(--color-warning-light); border-color: #f3dcb3; }
  .session-banner .s-figure { font-family: var(--font-sans); font-variant-numeric: tabular-nums; font-weight: 700; }
  .session-banner[hidden] { display: none; }

  .cash-mismatch-alert {
    background: var(--color-danger-light); color: var(--color-danger);
    border: 1px solid var(--color-danger); border-radius: var(--radius);
    padding: 10px 16px; margin-bottom: 18px; font-size: 13px; font-weight: 600;
  }
  .cash-mismatch-alert[hidden] { display: none; }

  /* ---------------- Empty state (small) ---------------- */
  .empty-state { text-align: center; padding: 30px 16px; color: var(--color-text-muted); font-size: 13px; }

  /* ---------------- Invoice ----------------
     The invoice body is a full A4 layout so the modal has to be wide
     enough to show it without squeezing it into a receipt-width box.
     modal-body gets its own horizontal scrollbar as a safety net on
     narrow/mobile viewports rather than letting the content clip. */
  #invoiceModal .modal { max-width: 860px; }
  #invoiceModal .modal-body { overflow-x: auto; background: var(--color-bg); }

  /* ---------------- Compact Invoice Print Engine ----------------
     Component-based: javascript.html's render*_ builders only emit a
     section's markup when it's enabled AND has data, so nothing here
     needs a "hide when empty" rule — the empty markup simply never
     exists, and no height is ever reserved for it.

     .invoice-paper is the shared outer wrapper (also reused, unchanged,
     by the unrelated ledger-range print feature below — keep it generic).
     .invoice-page is one physical page; a multi-item sale stacks several,
     each repeating the header/table header, only the last carrying
     totals/signature/footer (assembled in javascript.html, not here).

     All sizing lives in the --inv-* custom properties on .invoice-paper
     so A4 vs thermal is a handful of value overrides under .thermal,
     never a duplicated rule set — one shared design, per the brief.

     Zero-CDN rule means no webfont download for --font-bn, so this is a
     system-font stack: Nirmala UI ships with Windows, Kohinoor/Bangla MN
     with macOS/iOS, Noto Sans Bengali with Android/ChromeOS, and the
     SolaimanLipi/Kalpurush/Siyam Rupali entries cover machines where a
     user installed a Bangla font by hand. */
  .invoice-paper {
    --inv-row-h: 22px;
    --inv-page-pad-x: 12mm;
    --inv-page-pad-y: 6mm;
    --inv-page-pad-top: 3mm;
    --inv-ink: #16191a;
    --inv-border: #16191a;
    --inv-border-soft: #e2e5e6;
    --inv-muted: #6b7375;
    --inv-muted-soft: #8a9294;
    font-family: var(--font-bn);
    font-size: 13px;
    color: var(--inv-ink);
    background: #fff;
    line-height: 1.5;   /* Bangla stacks matras above and below — 1.2 clipped them */
    font-variant-numeric: tabular-nums;
  }

  /* One printed page. width:100%/max-width so it scales down in a narrow
     modal but never grows past a real A4 content area (210mm − 2×10mm
     @page margin = 190mm). box-shadow only draws the page edge on screen
     — the print rule below strips it since paper doesn't need a border
     around itself. min-height pins it to a full A4 content height (297mm
     − 2×10mm @page margin = 277mm, same 277mm the row budget in
     javascript.html is tuned against) so .inv-bottom's margin-top:auto
     below has actual free space to push into — otherwise the flex column
     just shrinks to fit content and totals/signatures/footer land right
     under the table instead of anchored to the bottom of the sheet.
     Thermal cancels this back to auto (continuous roll, not a fixed page). */
  .invoice-page {
    box-sizing: border-box;
    width: 100%;
    max-width: 190mm;
    min-height: calc(297mm - 20mm);
    margin: 0 auto 6mm;
    padding: var(--inv-page-pad-top) var(--inv-page-pad-x) var(--inv-page-pad-y);
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 2mm;
    box-shadow: 0 0 0 1px var(--inv-border-soft);
    position: relative;
  }

  /* ---- Header block: bismillah + customer/info row + shop header, grouped
     with a tighter internal gap than the page's default 3mm so the whole
     header area stays compact; the 3mm gap before the table is untouched
     since that's still the page-level flex gap. ---- */
  .inv-header-block { display: flex; flex-direction: column; gap: 1.5mm; }

  /* ---- Bismillah — only rendered when enabled AND non-empty; kept to one
     compact line with a small type size and minimal padding. ---- */
  .inv-bismillah {
    text-align: center;
    font-size: 11px;
    line-height: 1.2;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  /* ---- Header: logo/name/description left, address/phones right.
     Header height follows its content so long descriptions are not clipped. ---- */
  .inv-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8mm;
    border-bottom: 1.3px solid var(--inv-border);
    padding-bottom: 1mm;
  }
  .inv-header-brand { display: flex; gap: 3.5mm; align-items: flex-start; min-width: 0; }
  .inv-logo { max-height: 22mm; max-width: 32mm; width: auto; height: auto; object-fit: contain; flex-shrink: 0; }
  .inv-shop-name { margin: 0; font-size: 22px; font-weight: 700;}
  .inv-proprietor { font-size: 12.5px; color: var(--inv-ink);    font-weight: 600; margin-top: .1mm; }
  .inv-proprietor-paragraph {
    display: block;
    font-size: 11px;
    line-height: 1.4;
    color: var(--inv-muted);
    margin-top: .5mm;
    max-width: 92mm;
    white-space: pre-wrap;
  }
  .inv-shop-desc {
    font-size: 11.5px; color: var(--inv-muted); margin-top: 1mm; max-width: 92mm;
    white-space: pre-wrap;
  }
  .inv-header-side { text-align: right; font-size: 11.5px; color: var(--inv-muted); flex-shrink: 0; }
  .inv-header-side .inv-address { max-width: 60mm; margin-left: auto; }
  .inv-header-side .inv-phone { color: var(--inv-ink); font-weight: 600; }

  /* ---- Customer (left) + চালান নং/তারিখ (right), one horizontally
     aligned row below the header line. ---- */
  .inv-customer-info-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; }

  /* ---- Invoice info: stacked lines, e.g. "চালান নং : INV-000123" above "তারিখ : ..." ---- */
  .inv-info-row { display: flex; flex-direction: column; align-items: flex-end; gap: 1mm; font-size: 12.5px; text-align: right; flex-shrink: 0; }
  .inv-info-row b { font-weight: 700; }

  /* ---- Customer — entire block omitted when there's no customer data ---- */
  .inv-customer { font-size: 12.5px; min-width: 0; }
  .inv-customer-name { font-size: 14.5px; font-weight: 700; }
  .inv-customer-meta { display: flex; flex-wrap: wrap; gap: 1mm 6mm; color: var(--inv-muted); margin-top: .5mm; }

  /* ---- Product table — highest priority; grows to fill the page ---- */
  .inv-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .inv-table thead tr {  color: #fff; border-top: 1px solid var(--inv-ink);  }
  .inv-table th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--inv-ink); padding: 1.6mm 2.2mm; border-top: 1px solid var(--inv-ink); }
  .inv-table th.num, .inv-table td.num { text-align: right; }
  .inv-table td {
    padding: 0 2.2mm;
    height: var(--inv-row-h);
    border-bottom: 1px solid var(--inv-border-soft);
    vertical-align: middle;
  }
  .inv-table td.idx { color: var(--inv-muted-soft); width: 8mm; }
  .inv-table td.name { word-break: break-word; }
  .inv-table tr { break-inside: avoid; border-top: 1px solid var(--inv-ink); }

  /* ---- Bottom: payment/terms (left) + totals (right) — last page only.
     Sits in normal flow right after the table; only .inv-footer-block
     (signatures + footer text) below is anchored to the page bottom. ---- */
  .inv-bottom { display: flex; justify-content: space-between; gap: 8mm; }
  .inv-side { display: flex; flex-direction: column; gap: 3mm; max-width: 92mm; }
  .inv-side-label { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--inv-muted-soft); margin-bottom: 1mm; }
  .inv-payment-methods { display: flex; flex-wrap: wrap; gap: 2mm; }
  .inv-payment-chip { border: 1px solid var(--inv-border-soft); padding: 1.2mm 2.6mm; font-size: 11px; color: var(--inv-muted); }
  .inv-payment-chip.used { border-color: var(--inv-ink); color: var(--inv-ink); font-weight: 600; }
  .inv-terms { margin: 0; padding-left: 4mm; font-size: 11px; color: var(--inv-muted); line-height: 1.5; }

  .inv-totals { width: 60mm; flex-shrink: 0; }
  .inv-total-row { display: flex; justify-content: space-between; padding: 1.6mm 0; font-size: 12.5px; border-bottom: 1px solid var(--inv-border-soft); }
  .inv-total-row .v { font-weight: 600; }
  .inv-total-row.grand { align-items: baseline; }
  .inv-total-row.grand .v { font-size: 18px; font-weight: 700; }
  .inv-total-row.due { border-bottom: 2px solid var(--inv-ink); font-weight: 700; }
  .inv-words { font-size: 12px; color: var(--inv-ink); text-align: left; padding-top: 3px; }

  /* ---- Paid badge — automatic (Due == 0 && grandTotal > 0), no setting ---- */
   .inv-paid-badge {
    position: absolute;left:43%; top: 70mm; border: 2px solid #12805c; color: #12805c; font-weight: 700; font-size: 12px;
    letter-spacing: .1em; padding: 3mm 7mm; transform: rotate(-13deg); border-radius: 2px;
  }
  
  /* .inv-paid-badge {
    position: absolute; top: var(--inv-page-pad-top); right: var(--inv-page-pad-x);
    border: 2px solid #12805c; color: #12805c; font-weight: 700; font-size: 13px;
    letter-spacing: .1em; padding: 1.5mm 5mm; transform: rotate(-6deg); border-radius: 3px;
  } */

  /* ---- Signature + footer — the only pair anchored to the page bottom.
     .inv-footer-block wraps buildInvFooterBlock_'s output (javascript.html);
     margin-top:auto absorbs whatever free space .invoice-page's min-height
     leaves, pushing just this pair down, while .inv-bottom above (payment
     methods/terms/totals) stays in normal flow. Its own gap replaces the
     margin-tops the two children used to carry, since they're no longer
     direct children of .invoice-page and don't get its 2mm flex gap. ---- */
  .inv-footer-block { display: flex; flex-direction: column; gap: 2mm; margin-top: auto; }
  .inv-signatures { display: flex; justify-content: space-between; gap: 16mm; }
  .inv-signature { flex: 1; border-top: 1px solid var(--inv-ink); padding-top: 1.5mm; font-size: 11.5px; text-align: center; }
  .inv-footer-text { text-align: center; font-size: 10.5px; color: var(--inv-muted-soft); border-top: 1px solid var(--inv-border-soft); padding-top: 1.5mm; }

  /* ---- Thermal receipt (58/80mm) ---------------------------------------
     Thermal is intentionally a compact receipt, not a squeezed A4 invoice.
     It uses dedicated markup from renderInvoiceHtmlThermal_ and named print
     pages so Chrome does not center a tiny 58/80mm receipt on an A4 sheet. */
  .invoice-paper.thermal:not(.size-58) { page: thermal80; }
  .invoice-paper.thermal.size-58 { page: thermal58; }
  @page thermal80 { size: 80mm 200mm; margin: 2mm; }
  @page thermal58 { size: 58mm 200mm; margin: 2mm; }

  .invoice-paper.thermal .invoice-page {
    width: 76mm; max-width: 76mm; min-height: 0; margin: 0 auto; padding: 0;
    box-shadow: none; gap: 0; font-size: 10.5px; line-height: 1.35;
  }
  .invoice-paper.thermal.size-58 .invoice-page { width: 54mm; max-width: 54mm; }
  .thermal-receipt { width: 100%; color: #111; background: #fff; padding: 1.5mm; }
  .thermal-head { text-align: center; padding-bottom: 2mm; border-bottom: 1px dashed #777; }
  .thermal-shop-name { font-size: 15px; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
  .thermal-shop-address, .thermal-shop-phone { margin-top: .7mm; font-size: 9.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .thermal-draft { margin-bottom: 1.5mm; text-align: center; font-weight: 800; font-size: 11px; letter-spacing: .06em; }
  .thermal-meta { padding: 1.5mm 0; border-bottom: 1px dashed #777; }
  .thermal-meta > div, .thermal-totals > div, .thermal-item-detail, .thermal-items-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 2mm;
  }
  .thermal-meta > div + div { margin-top: .7mm; }
  .thermal-meta > div > :last-child { text-align: right; overflow-wrap: anywhere; }
  .thermal-items { padding-top: 1mm; }
  .thermal-items-head { padding-bottom: .8mm; font-size: 9px; font-weight: 700; color: #555; border-bottom: 1px solid #bbb; }
  .thermal-item { padding: 1.2mm 0; border-bottom: 1px dotted #bbb; break-inside: avoid; page-break-inside: avoid; }
  .thermal-item-name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; word-break: break-word; }
  .thermal-item-detail { margin-top: .5mm; font-size: 9.5px; }
  .thermal-item-detail b { font-size: 10.5px; }
  .thermal-totals { padding-top: 1.2mm; }
  .thermal-totals > div { min-height: 5mm; padding: .5mm 0; }
  .thermal-grand { border-top: 1px solid #111; margin-top: .6mm; padding-top: 1mm !important; font-size: 12px; font-weight: 700; }
  .thermal-due { border-top: 1px dashed #777; font-size: 11.5px; font-weight: 700; }
  .thermal-thanks { margin-top: 1.5mm; padding-top: 1.5mm; border-top: 1px dashed #777; text-align: center; font-size: 9.5px; }

  /* Print-only host. printInvoice_ clones the invoice in here — a direct
     child of <body> — so printing never depends on where #invoiceModal
     sits in the DOM. Empty and display:none at every other moment. */
 #printHost { display: none; }

  /* ---------------- Delete system ----------------
     .btn-danger is the only new button variant; it inherits everything
     else from .btn. */
  .btn-danger {
    background: var(--color-danger);
    border-color: var(--color-danger);
    color: #fff;
  }
  .btn-danger:hover { filter: brightness(0.93); }

  /* Explains what a delete will do, inside the confirm dialog. */
  .delete-warning {
    background: #fff8e6;
    border: 1px solid #f0d089;
    border-radius: var(--radius);
    padding: 10px 12px;
    margin: 12px 0;
    font-size: 13px;
    line-height: 1.5;
  }

  /* Shown when the SERVER refuses a delete - stock already sold, a return
     exists. Stays on screen instead of a toast, because the message tells
     the user what to do first and they need time to read it. */
  .delete-blocked {
    background: #fdecea;
    border: 1px solid #f5b5ae;
    border-radius: var(--radius);
    padding: 10px 12px;
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.5;
  }

  /* A soft-deleted row, shown only to an Administrator. */
  tr.row-deleted { opacity: 0.55; }
  tr.row-deleted td { text-decoration: line-through; }
  tr.row-deleted td:last-child { text-decoration: none; }

  /* Refresh button spinner. */
  #refreshBtn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------------- Ledger range printing ----------------
     Only needs to look right on paper - the wrapper .invoice-paper and the
     body.printing-invoice switch do all the layout work already. */
  .ledger-print-title { margin: 0 0 4px; font-size: 18px; }
  .ledger-print-meta { margin-bottom: 12px; font-size: 12px; color: #555; }
  .ledger-print-table { width: 100%; border-collapse: collapse; font-size: 12px; }

       blank second page: a visibility:hidden element still occupies its
       full layout height, so the old rule left the whole app shell taking
       up space in the printed document even though nothing was drawn. */
    body.printing-invoice > *:not(#printHost) { display: none !important; }
    body.printing-invoice #printHost { display: block !important; }

    body.printing-invoice .invoice-page {
      box-shadow: none;
      margin: 0;

      break-inside: avoid !important;
      page-break-inside: avoid !important;

    body.printing-invoice .invoice-page.invoice-print-page .inv-footer-block {
      position: static !important;

    }
    body.printing-invoice .inv-table tbody {

    body.printing-invoice .inv-table tr {
