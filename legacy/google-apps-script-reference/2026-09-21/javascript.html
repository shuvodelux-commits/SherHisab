<script>
  /* ---------------------------------------------------------------------
   * javascript.html — the shared client engine.
   *
   * COMPLETE REBUILD. This file now contains a full authentication layer
   * written against Auth.gs's contract (login / validateSession / logout,
   * returning { token, user, allowedModules }). It REPLACES whatever auth
   * wiring your live copy had rather than merging with it — diff the two
   * if yours stored the token differently or filtered the nav its own way.
   *
   * What lives here:
   *   1.  Icon set
   *   2.  Auth: boot, login, logout, session restore
   *   3.  Navigation, filtered by the signed-in role
   *   4.  serverCall  — the one wrapper every page uses
   *   5.  Shared UI helpers (toast, loader, modals, money, escaping)
   *   6.  Bangla invoice rendering
   *   7.  One-page printing
   *   8.  Canvas receipt (JPG download)
   * ------------------------------------------------------------------- */

  // ---------------- 1. Inline SVG icons — no icon font, no CDN ----------------
  var ICONS = {
    dashboard: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>',
    pos: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 5h18l-1.5 9h-13L3 5Zm2.5 12a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm11 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    counter: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 4h14v16H5zM8 8h8M8 12h3M14 12h2M8 16h3M14 16h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    purchase: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7h13l3 4v6h-3M3 7v10h3M3 7l1-3h9l1 3M9 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    suppliers: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 21V10l9-6 9 6v11h-6v-7H9v7H3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    vendors: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7l9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 12v5l9 4 9-4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    products: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 8 12 3 3 8l9 5 9-5Zm0 0v8l-9 5-9-5V8m18 0-9 5m0 0L3 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    customers: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 14a4 4 0 1 0-4-4M4 20c0-3 3-5 6-5m4-1c3 0 6 2 6 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    sales: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h9l3 3v15H6V3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    returns: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 8h11a5 5 0 0 1 0 10h-2M4 8l4-4M4 8l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    reports: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 20V10m6 10V4m6 16v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    settings: '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.5a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.6 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.5a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    bank: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 10 12 4l9 6M5 10v9M9 10v9M15 10v9M19 10v9M3 21h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    expense: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    daybook: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5c2-1 5-1 8 1 3-2 6-2 8-1v13c-2-1-5-1-8 1-3-2-6-2-8-1V5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6v13" stroke="currentColor" stroke-width="2"/></svg>',
    finance: '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5.8 2.5 2c0 3-5 1.5-5 4.5 0 1.2 1.1 2 2.5 2s2.5-1.1 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    users: '<svg viewBox="0 0 24 24" width="18" height="18"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16.5 5.5a3 3 0 0 1 0 5.8M18 14.8c2 .7 3.5 2.5 3.5 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    roles: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3 4 6v6c0 4.4 3.4 7.9 8 9 4.6-1.1 8-4.6 8-9V6l-8-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  // ---------------- 2. Application + auth state ----------------
  // authToken is read by every page file, so it must stay a global.
  var authToken = '';
  var currentUser = null;
  var allowedModules = null;      // null = Administrator = every module
  var userPermissions = null;     // null = Administrator; otherwise per-module actions
  var appCurrencySymbol = '';
  var currentPage = 'dashboard';
  var navItems_ = [];        // the full NAV_ITEMS from UI.gs, groups and all
  var appShellDataPromise_ = null; // one request shared by login branding + authenticated shell

  var TOKEN_KEY = 'hwerp.session.token';
  var SIDEBAR_COLLAPSED_KEY = 'hwerp.sidebar.collapsed.v1';
  var memoryToken = '';           // fallback when storage is unavailable

  /**
   * Apps Script serves the app inside a sandboxed iframe, and some browser
   * privacy settings make localStorage throw on access rather than simply
   * return null. Falling back to a variable keeps the session alive for the
   * current tab instead of breaking login outright.
   */
  function storeToken_(token) {
    memoryToken = token || '';
    try { if (token) window.localStorage.setItem(TOKEN_KEY, token); else window.localStorage.removeItem(TOKEN_KEY); }
    catch (e) { /* storage blocked — memoryToken carries it */ }
  }
  function readStoredToken_() {
    try { return window.localStorage.getItem(TOKEN_KEY) || memoryToken || ''; }
    catch (e) { return memoryToken || ''; }
  }
  function clearStoredToken_() { storeToken_(''); }

  function isPhoneViewport_() {
    if (window.matchMedia) {
      return window.matchMedia('(max-width: 540px), (orientation: landscape) and (max-height: 540px) and (pointer: coarse)').matches;
    }
    return !!window.innerWidth && window.innerWidth <= 540;
  }

  function setSidebarCollapsed_(collapsed, persist) {
    var app = document.getElementById('app');
    if (!app) return;
    app.classList.toggle('sidebar-collapsed', !!collapsed);
    var toggle = document.getElementById('menuToggle');
    if (toggle) toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    if (persist === false) return;
    try { window.localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '0'); }
    catch (e) { /* storage blocked — current DOM state still works */ }
  }

  function restoreSidebarState_() {
    if (!window.innerWidth || isPhoneViewport_()) return;
    var saved = null;
    try { saved = window.localStorage.getItem(SIDEBAR_COLLAPSED_KEY); }
    catch (e) { saved = null; }
    var collapsed = saved === '1';
    if (saved === null) collapsed = true;
    setSidebarCollapsed_(collapsed, false);
  }

  function collapseSidebarOverlay_() {
    if (isPhoneViewport_()) return;
    var app = document.getElementById('app');
    if (!app || app.classList.contains('sidebar-collapsed')) return;
    setSidebarCollapsed_(true, true);
  }

  function updateMobileViewportMetrics_() {
    var root = document.documentElement;
    if (!root) return;
    var viewportHeight = window.visualViewport && window.visualViewport.height
      ? window.visualViewport.height
      : (window.innerHeight || root.clientHeight || 0);
    if (viewportHeight > 0) root.style.setProperty('--app-viewport-height', Math.round(viewportHeight) + 'px');

    var nav = document.getElementById('mobileBottomNav');
    var navHeight = 0;
    if (isPhoneViewport_() && nav) {
      var display = window.getComputedStyle ? window.getComputedStyle(nav).display : '';
      if (display !== 'none') {
        var rect = nav.getBoundingClientRect();
        navHeight = Math.max(0, Math.ceil(rect.height || 0));
      }
    }
    root.style.setProperty('--mobile-nav-clearance', (navHeight > 0 ? navHeight + 8 : 72) + 'px');
  }

  function wireMobileViewportMetrics_() {
    updateMobileViewportMetrics_();
    window.addEventListener('resize', updateMobileViewportMetrics_);
    window.addEventListener('orientationchange', updateMobileViewportMetrics_);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateMobileViewportMetrics_);
      window.visualViewport.addEventListener('scroll', updateMobileViewportMetrics_);
    }
  }

  function toggleDesktopSidebar_() {
    var app = document.getElementById('app');
    if (!app) return;
    setSidebarCollapsed_(!app.classList.contains('sidebar-collapsed'), true);
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderClock_();
    setInterval(renderClock_, 60 * 1000);
    wireTopbarDatePopover_();

    restoreSidebarState_();
    wireMobileViewportMetrics_();

    var menuToggle = document.getElementById('menuToggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function () {
        if (isPhoneViewport_()) {
          openMobileMore_();
          return;
        }
        toggleDesktopSidebar_();
      });
    }

    var sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');
    if (sidebarCollapseBtn) {
      sidebarCollapseBtn.addEventListener('click', function () {
        setSidebarCollapsed_(true, true);
      });
    }

    var sidebarBackdrop = document.getElementById('sidebarBackdrop');
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', function () {
        collapseSidebarOverlay_();
      });
    }

    wireCalcPanel_();
    initSearchClearUx_();
    initTouchControls_();

    wireLoginForm_();
    brandLoginScreen_();
    bootstrapSession_();
    // Runs after every page file's <script> has executed, so their loader
    // functions exist by now.
    wirePageReloaders_();
  });

  /**
   * One app-shell request per page lifetime. Login branding starts it early;
   * authenticated shell construction reuses the same promise instead of
   * immediately issuing the same Apps Script call again.
   */
  function getAppShellDataOnce_() {
    if (!appShellDataPromise_) {
      appShellDataPromise_ = serverCall('getAppShellData').catch(function (err) {
        // A setup/transient error must not poison future attempts.
        appShellDataPromise_ = null;
        throw err;
      });
    }
    return appShellDataPromise_;
  }

  /** Fills the shop name on the login card. getAppShellData is deliberately ungated so this works before sign-in. */
  function brandLoginScreen_() {
    getAppShellDataOnce_().then(function (data) {
      var n = document.getElementById('loginShopName');
      var l = document.getElementById('loginLogoMark');
      if (n) n.textContent = data.shopName;
      if (l) l.textContent = initials_(data.shopName);
    }).catch(function () { /* not set up yet — the default title stands */ });
  }

  /** Restores a saved session, or shows the login card. */
  function bootstrapSession_() {
    var saved = readStoredToken_();
    if (!saved) { showLogin_(); return; }
    withLoader(serverCall('validateSession', saved))
      .then(function (payload) { onAuthenticated_(payload); })
      .catch(function () { clearStoredToken_(); showLogin_(); });
  }

  function wireLoginForm_() {
    var btn = document.getElementById('loginSubmitBtn');
    if (!btn) return;

    btn.addEventListener('click', doLogin_);
    ['loginMobile', 'loginPassword'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin_(); });
    });

    var toggle = document.getElementById('loginTogglePassword');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var pw = document.getElementById('loginPassword');
        var showing = pw.type === 'text';
        pw.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
      });
    }
  }

  function setLoginPending_(pending) {
    var btn = document.getElementById('loginSubmitBtn');
    var spinner = document.getElementById('loginBtnSpinner');
    var label = document.getElementById('loginBtnLabel');
    if (!btn) return;
    btn.disabled = !!pending;
    btn.setAttribute('aria-busy', pending ? 'true' : 'false');
    if (spinner) spinner.hidden = !pending;
    if (label) label.textContent = pending ? 'Logging in…' : 'Login';
  }

  function doLogin_() {
    var errEl = document.getElementById('loginError');
    var btn = document.getElementById('loginSubmitBtn');
    var mobile = (document.getElementById('loginMobile').value || '').trim();
    var password = document.getElementById('loginPassword').value || '';

    if (errEl) errEl.style.display = 'none';
    if (!mobile || !password) {
      if (errEl) { errEl.textContent = 'Enter your mobile number and password.'; errEl.style.display = 'block'; }
      return;
    }

    setLoginPending_(true);
    withLoader(serverCall('login', mobile, password))
      .then(function (payload) {
        document.getElementById('loginPassword').value = '';
        onAuthenticated_(payload);
      })
      .catch(function (err) {
        if (errEl) { errEl.textContent = err.message || 'Sign in failed.'; errEl.style.display = 'block'; }
      })
      .finally(function () { setLoginPending_(false); });
  }

  function onAuthenticated_(payload) {
    authToken = payload.token;
    currentUser = payload.user;
    allowedModules = payload.allowedModules;   // null for Administrator
    userPermissions = payload.permissions || null;
    storeToken_(authToken);
    hideLogin_();
    return loadAppShell_();
  }

  function doLogout_() {
    var token = authToken;
    authToken = '';
    currentUser = null;
    allowedModules = null;
    userPermissions = null;
    clearStoredToken_();
    serverCall('logout', token).catch(function () { /* the local session is gone either way */ });
    window.location.reload();
  }

  function showLogin_() {
    var o = document.getElementById('loginOverlay');
    if (o) o.hidden = false;
    var app = document.getElementById('app');
    if (app) app.style.visibility = 'hidden';
  }

  function hideLogin_() {
    var o = document.getElementById('loginOverlay');
    if (o) o.hidden = true;
    var app = document.getElementById('app');
    if (app) app.style.visibility = '';
  }

  function loadAppShell_() {
    return getAppShellDataOnce_()
      .then(function (data) {
        document.getElementById('shopNameLabel').textContent = data.shopName;
        document.getElementById('logoMark').textContent = initials_(data.shopName);
        appCurrencySymbol = data.currencySymbol || '';

        navItems_ = data.navItems;
        var items = filterNavByRole_(data.navItems);
        buildNav_(items);
        buildMobileNav_(items);
        renderSidebarFooter_();

        // Land on a page this role can actually open — for a group that
        // means its first visible tab, not the group itself.
        goToPage(firstReachableKey_(items));
      })
      .catch(function (err) {
        showToast(err.message || 'Could not load app settings.', 'error');
      });
  }

  /**
   * Administrator (allowedModules === null) sees everything. Any other role
   * sees Dashboard plus whatever its Allowed Modules lists.
   *
   * This is presentation only. The real gate is requirePermission_ on every
   * server function — hiding a menu item is convenience, not security.
   */
  function hasSpecialEditPermission_(permissionKey) {
    if (allowedModules === null) return true;
    var p = userPermissions && userPermissions[permissionKey];
    return !!(p && p.edit);
  }

  function hasActionPermission_(moduleKey, action) {
    if (allowedModules === null) return true;
    var p = userPermissions && userPermissions[moduleKey];
    return !!(p && p[action]);
  }

  function actionPermAnyVisible_(item) {
    return !!(item && item.actionPermAny && item.actionPermAny.some(function (perm) {
      return hasActionPermission_(perm.module, perm.action);
    }));
  }

  function navItemVisible_(item) {
    if (!item) return false;
    if (allowedModules === null || allowedModules === undefined) return true;
    if (item.actionPermAny) return actionPermAnyVisible_(item);
    if (item.specialPermKey) return hasSpecialEditPermission_(item.specialPermKey);
    if (allowedModules.indexOf(item.key) !== -1) return true;
    return (item.children || []).some(function (c) {
      if (c.adminOnly) return false;
      if (c.specialPermKey) return hasSpecialEditPermission_(c.specialPermKey);
      var key = c.permKey || c.key;
      return allowedModules.indexOf(key) !== -1;
    });
  }

  function filterNavByRole_(navItems) {
    if (allowedModules === null || allowedModules === undefined) return navItems;
    return navItems.filter(function (item) {
      if (item && item.specialPermKey) return hasSpecialEditPermission_(item.specialPermKey);
      return navItemVisible_(item);
    });
  }

  /**
   * Is this sub-tab visible to the signed-in user? groupKey is the parent
   * group's own key (e.g. 'settings') — children like 'invoiceDesign' that
   * don't have their own PERMISSION_MODULES entry ride on the group's grant
   * instead, the same way the group's own landing-page child always has.
   */
  function subNavVisible_(child, groupKey) {
    if (child.adminOnly) return allowedModules === null;
    if (allowedModules === null) return true;
    if (child.actionPermAny) return actionPermAnyVisible_(child);
    if (child.specialPermKey) return hasSpecialEditPermission_(child.specialPermKey);
    if (child.permKey) return allowedModules.indexOf(child.permKey) !== -1;
    if (child.key === groupKey) return allowedModules.indexOf(groupKey) !== -1;
    if (child.key === 'returns' || child.key === 'users' || child.key === 'roles') {
      return allowedModules.indexOf(child.key) !== -1;
    }
    return !!groupKey && allowedModules.indexOf(groupKey) !== -1;
  }

  /** The NAV_ITEMS entry a page key belongs to — itself, or the group holding it. */
  function navGroupFor_(key) {
    for (var i = 0; i < navItems_.length; i++) {
      var item = navItems_[i];
      if (item.key === key && !item.children) return item;
      if ((item.children || []).some(function (c) { return c.key === key; })) return item;
      if (item.key === key) return item;
    }
    return null;
  }

  /** First page this user can actually open, so we never land on a blank one. */
  function firstReachableKey_(items) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.children) {
        if (navItemVisible_(it)) return it.key;
      } else {
        var kids = it.children.filter(function (c) { return subNavVisible_(c, it.key); });
        if (kids.length) return kids[0].key;
      }
    }
    return allowedModules === null ? 'dashboard' : 'noAccess';
  }

  /**
   * Renders the sub-tab strip under the header. Doing it centrally means
   * sales.html, returns.html, settings.html, users.html and roles.html need
   * no changes at all — they are still ordinary pages, just reached from a
   * tab instead of the sidebar.
   */
  function renderSubNav_(group, activeKey) {
    var host = document.getElementById('subNav');
    if (!host) return;
    var kids = (group && group.children) ? group.children.filter(function (c) { return subNavVisible_(c, group.key); }) : [];
    if (kids.length < 2) { host.hidden = true; host.innerHTML = ''; return; }

    host.innerHTML = '';
    kids.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'tab-btn' + (c.key === activeKey ? ' active' : '');
      b.innerHTML = escapeHtml(c.label) + (c.bn ? '<span class="bn-hint">' + escapeHtml(c.bn) + '</span>' : '');
      b.addEventListener('click', function () { goToPage(c.key); });
      host.appendChild(b);
    });
    host.hidden = false;
  }

  function firstAvailablePage_(items) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!it.children) return it.key;
      var kids = it.children.filter(function (c) { return subNavVisible_(c, it.key); });
      if (kids.length) return kids[0].key;
    }
    return 'pos';
  }

  function renderSidebarFooter_() {
    var footer = document.querySelector('.sidebar-footer');
    if (!footer || !currentUser) return;
    footer.innerHTML =
      '<div style="font-weight:600;">' + escapeHtml(currentUser.name || currentUser.mobile) + '</div>' +
      '<div style="opacity:.7; margin-bottom:8px;">' + escapeHtml(currentUser.role) + '</div>' +
      '<button class="btn" id="logoutBtn" style="width:100%;" title="Sign out" aria-label="Sign out">Sign out</button>';
    document.getElementById('logoutBtn').addEventListener('click', function () {
      var btn = this;
      confirmAction({
        type: 'state-change',
        title: 'Sign out?',
        message: 'Your current SherERP session will end.',
        details: [{ label: 'User', value: currentUser ? (currentUser.name || currentUser.mobile || '') : '', emphasis: true }],
        confirmLabel: 'Sign out',
        trigger: btn
      }).then(function (result) { if (result.confirmed) doLogout_(); });
    });
  }

  function initials_(name) {
    if (!name) return 'HS';
    var words = name.trim().split(/\s+/).slice(0, 2);
    return words.map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || 'HS';
  }

  // ---------------- 3. Navigation ----------------
  // UI.gs's NAV_ITEMS is the only nav list. There used to be a duplicate
  // defaultNavItems_() here and the two had drifted apart — this copy had
  // Expenses and Day Book, the server one didn't, so those pages appeared
  // only when the shell call FAILED.
  function sidebarItemsInOrder_(items) {
    return (items || []).slice().sort(function (a, b) {
      var ao = Number(a && a.sidebarOrder);
      var bo = Number(b && b.sidebarOrder);
      if (!isFinite(ao)) ao = 9999;
      if (!isFinite(bo)) bo = 9999;
      return ao - bo;
    });
  }

  function buildNav_(items) {
    var nav = document.getElementById('navList');
    nav.innerHTML = '';
    var lastGroup = null;
    sidebarItemsInOrder_(items).forEach(function (item) {
      var group = Number(item.sidebarGroup);
      if (lastGroup !== null && group !== lastGroup) {
        var divider = document.createElement('div');
        divider.className = 'nav-divider';
        divider.setAttribute('aria-hidden', 'true');
        nav.appendChild(divider);
      }
      lastGroup = group;

      var el = document.createElement('div');
      el.className = 'nav-item';
      el.dataset.page = item.key;
      el.title = item.label;
      el.setAttribute('aria-label', item.label);

  function toBanglaDigits_(value) {
    var map = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  function formatEnglishDate_(date) {
    return new Intl.DateTimeFormat('en-GB', {
      weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
    }).format(date);
  }

  function isGregorianLeapYear_(year) {
    return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  }

  function formatBanglaDate_(date) {
    // Bangladesh civil Bangla calendar display. Keep storage/reporting in Gregorian date.
    var months = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
    var gy = date.getFullYear();
    var start = new Date(gy, 3, 14); // 14 April is ১ বৈশাখ in Bangladesh.
    var by = gy - 593;
    var diff = Math.floor((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - start) / 86400000);

    if (diff < 0) {
      gy -= 1;
      start = new Date(gy, 3, 14);
      by = gy - 593;
      diff = Math.floor((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - start) / 86400000);
    }

    var lengths = [31, 31, 31, 31, 31, 30, 30, 30, 30, 30, isGregorianLeapYear_(gy + 1) ? 31 : 30, 30];
    var mi = 0;
    while (mi < lengths.length - 1 && diff >= lengths[mi]) {
      diff -= lengths[mi];
      mi += 1;
    }

    return toBanglaDigits_(diff + 1) + ' ' + months[mi] + ' ' + toBanglaDigits_(by);
  }

  var HIJRI_BANGLADESH_DAY_ADJUSTMENT = -2; // Bangladesh observed Hijri date can differ from browser Intl by moon sighting.

  function gregorianToIslamicCivil_(date) {
    // Deterministic fallback for browsers/WebViews with incomplete Intl Islamic-calendar support.
    // The Bangladesh moon-sighting adjustment is applied before this function is called.
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();

    var a = Math.floor((14 - m) / 12);
    var yy = y + 4800 - a;
    var mm = m + 12 * a - 3;
    var jd = d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4)
      - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;

    var l = jd - 1948440 + 10632;
    var n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    var j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719)
      + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50)
      - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
    var im = Math.floor((24 * l) / 709);
    var id = l - Math.floor((709 * im) / 24);
    var iy = 30 * n + j - 30;

    return { day: id, month: im, year: iy };
  }

  function formatHijriDate_(date) {
    var hijriMonths = [
      'মহরম',
      'সফর',
      'রবিউল আউয়াল',
      'রবিউস সানি',
      'জমাদিউল আউয়াল',
      'জমাদিউস সানি',
      'রজব',
      'শাবান',
      'রমজান',
      'শাওয়াল',
      'জিলকদ',
      'জিলহজ'
    ];

    var bdObservedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    bdObservedDate.setDate(bdObservedDate.getDate() + HIJRI_BANGLADESH_DAY_ADJUSTMENT);

    try {
      // Use only numeric Islamic calendar parts. Some Android Chrome/WebView versions
      // return a Gregorian English month name (for example "March") when month:'long'
      // is requested even though the Hijri day/year are correct.
      var formatter = new Intl.DateTimeFormat('en-US-u-ca-islamic-nu-latn', {
        day: 'numeric', month: 'numeric', year: 'numeric'
      });
      var resolved = formatter.resolvedOptions ? formatter.resolvedOptions() : null;
      var calendar = resolved && resolved.calendar ? String(resolved.calendar).toLowerCase() : '';

      if (!calendar || calendar.indexOf('islamic') === 0) {
        var parts = formatter.formatToParts(bdObservedDate);
        var dayPart = parts.filter(function (p) { return p.type === 'day'; })[0];
        var monthPart = parts.filter(function (p) { return p.type === 'month'; })[0];
        var yearPart = parts.filter(function (p) { return p.type === 'year'; })[0];

        var day = dayPart ? parseInt(dayPart.value, 10) : NaN;
        var month = monthPart ? parseInt(monthPart.value, 10) : NaN;
        var year = yearPart ? parseInt(yearPart.value, 10) : NaN;

        if (isFinite(day) && isFinite(month) && month >= 1 && month <= 12 && isFinite(year)) {
          return toBanglaDigits_(day) + ' ' + hijriMonths[month - 1] + ' ' + toBanglaDigits_(year);
        }
      }
    } catch (err) {
      // Fall through to deterministic conversion below.
    }

    var fallback = gregorianToIslamicCivil_(bdObservedDate);
    return toBanglaDigits_(fallback.day) + ' ' + hijriMonths[fallback.month - 1] + ' ' + toBanglaDigits_(fallback.year);
  }

  // ---------------- 5. google.script.run wrapped as a Promise ----------------
  // Every server function returns { success, data } or { success:false, message }
  // (see ok_ / fail_ in Utils.gs) so every call is handled the same way:
  //   serverCall('someFunction', authToken, arg).then(...).catch(...)
  function serverCall(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res === null || res === undefined) {
            reject(new Error(fnName + '() returned nothing. If this keeps happening, check Extensions → Apps Script → Executions for the real server-side error.'));
            return;
          }
          if (res.success === false) { reject(new Error(res.message || 'Server error')); return; }
          resolve(res.data !== undefined ? res.data : res);
        })
        .withFailureHandler(function (err) { reject(err); });

      // Without this guard, calling a name that doesn't exist server-side
      // fails as "Cannot read properties of undefined (reading 'apply')",
      // which says nothing about WHICH call broke. Two causes, both named
      // here: the function genuinely doesn't exist, or a .gs file failed to
      // parse and took every global down with it.
      if (typeof runner[fnName] !== 'function') {
        reject(new Error(
          'No server function named "' + fnName + '". Either it is missing from the .gs files, ' +
          'or one of them has a syntax error and none of the functions loaded. ' +
          'Check Extensions → Apps Script → Executions.'
        ));
        return;
      }
      runner[fnName].apply(runner, args);
    });
  }

  // ---------------- 6. Shared across every page ----------------
  function formatMoney(amount) {
    var n = Number(amount) || 0;
    return appCurrencySymbol + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function escapeHtml(str) {

  // Phone numbers are identifiers, not numbers. These client helpers mirror
  // Utils.gs so local 017..., a legacy Sheets-damaged 17..., +880..., and
  // punctuation-separated forms all resolve to the same Bangladesh mobile
  // for search/selection without changing the value shown to the user.
  function normalizePhoneSearch_(value) {
    var text = value === null || value === undefined ? '' : String(value).trim();
    var bnDigits = '০১২৩৪৫৬৭৮৯';
    text = text.replace(/[০-৯]/g, function (d) { return String(bnDigits.indexOf(d)); });
    var digits = text.replace(/\D/g, '');
    if (/^8801[3-9]\d{8}$/.test(digits)) digits = '0' + digits.slice(3);
    else if (/^1[3-9]\d{8}$/.test(digits)) digits = '0' + digits;

  // ---------------- Shared customer/supplier party search ----------------

      ? smartSearchNormalize_(value)
      : String(value || '').toLowerCase().replace(/\s+/g, ' ').trim();

    var compact = q.replace(/\s+/g, '');
    var phoneOnly = /^[0-9]+$/.test(compact);
    var tokens = q.split(' ').filter(Boolean);
    var max = Math.max(1, Number(limit) || 20);
    return (items || []).filter(function (item) {
      if (phoneOnly) return phoneSearchMatches_(item && item.phone, query);
      var name = partySearchNormalize_(item && item.name || '');
      return tokens.every(function (token) { return name.indexOf(token) !== -1; });
    }).slice(0, max);
  }

  function createPartySearchCombobox_(config) {

    }

      input.dataset.selectedId = String(item.id || '');

      toggleButton.addEventListener('click', function (e) {

   * is blank, original order is preserved. `limit` is optional and is only
   * applied after ranking.

  function smartSearchProducts_(products, query, limit) {

    var tokens = q.split(' ').filter(Boolean);

    list.forEach(function (product, originalIndex) {
      var idx = product[SMART_PRODUCT_SEARCH_KEY_] || smartBuildProductIndex_(product);

      // pre-index; normal page loaders always call smartIndexProducts_().
      if (!product[SMART_PRODUCT_SEARCH_KEY_]) product[SMART_PRODUCT_SEARCH_KEY_] = idx;

      else if (idx.name && idx.name.indexOf(q) === 0) score = 300000;
      else if (smartAllTokensMatch_(tokens, function (token) { return smartAnyWordStartsWith_(idx.nameWords, token); })) score = 200000;
      else if (smartAllTokensMatch_(tokens, function (token) { return smartAnyWordStartsWith_(idx.words, token); })) score = 100000;
