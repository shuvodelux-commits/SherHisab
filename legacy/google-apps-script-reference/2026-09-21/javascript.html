  function promptForUpdateReason_() {
    var reason = prompt('Reason for updating this invoice (e.g. Wrong quantity, Wrong product, Wrong discount, Wrong customer, Other):');
    if (reason === null) return null;
    reason = reason.trim();
    if (!reason) { showToast('A reason is required to update an invoice.', 'error'); return null; }
    return reason;
  }

  // ---------------- 6b. Topbar calculator ----------------
  // A scratchpad, not a transaction tool: it never touches serverCall or
  // any sheet, so it carries none of CLAUDE.md's transaction-safety rules.
  // Numbered lines are the source of truth; each is a free-typed expression
  // evaluated independently (no cross-line references), and the total is
  // the sum of every line that currently evaluates cleanly.
  var CALC_STORAGE_KEY = 'hwerp.calc.lines';
  var calcLines_ = [''];
  var calcActiveIdx_ = 0; // which line the touch keypad types into — kept in sync by each input's 'focus' handler

  function calcLoad_() {
    try {
      var raw = window.localStorage.getItem(CALC_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) {
        calcLines_ = parsed.map(function (v) { return String(v); });
        return;
      }
    } catch (e) { /* storage blocked or corrupt — fall through to default */ }
    calcLines_ = [''];
  }
  function calcSave_() {
    try { window.localStorage.setItem(CALC_STORAGE_KEY, JSON.stringify(calcLines_)); }
    catch (e) { /* storage blocked — scratchpad just won't survive a reload */ }
  }

  /**
   * A small recursive-descent parser for +, -, *, / and parentheses —
   * deliberately not eval()/Function(), since this reads whatever the user
   * types. Accepts × ÷ x as multiply/divide so "5 x 5" and "5×5" both work.
   * Returns {value, error} instead of throwing so callers never need a
   * try/catch around every keystroke.
   *
   * '%' is context-sensitive, matching phone/OS calculators: as the
   * immediate right-hand side of + or -, "N%" means "N percent of the
   * running total so far" (500 + 10% -> 550, a discount/markup shortcut).
   * Everywhere else — standalone, or combined with * or / — it's just
   * N/100 (500 * 10% -> 50). parseFactor/parseTerm carry a `percent` flag
   * so parseExpr can tell which case it's in; the flag is dropped the
   * moment a term becomes anything more than a single percented factor
   * (multiplied/divided, or parenthesized), which is what keeps e.g.
   * "(10%)" or "5%*2" literal instead of "smart".
   */
  function calcEvaluate_(expr) {
    var s = String(expr || '').trim();
    if (!s) return { value: 0, error: false };
    s = s.replace(/,/g, '').replace(/[×xX]/g, '*').replace(/÷/g, '/');
    var pos = 0;
    function peek() { return s.charAt(pos); }
    function skipSpace() { while (s.charAt(pos) === ' ') pos++; }
    function parseExpr() {
      var t = parseTerm();
      var v = t.value;
      while (true) {
        skipSpace();
        var c = peek();
        if (c === '+' || c === '-') {
          pos++;
          var left = v;
          var rhs = parseTerm();
          var rhsVal = rhs.percent ? left * rhs.value : rhs.value;
          v = c === '+' ? v + rhsVal : v - rhsVal;
        } else break;
      }
      return v;
    }
    function parseTerm() {
      var f = parseFactor();
      var v = f.value;
      var percent = f.percent;
      while (true) {
        skipSpace();
        var c = peek();
        if (c === '*' || c === '/') {
          pos++;
          var rhs = parseFactor();
          v = c === '*' ? v * rhs.value : v / rhs.value;
          percent = false;
        } else break;
      }
      return { value: v, percent: percent };
    }
    function parseFactor() {
      skipSpace();
      var c = peek();
      if (c === '+') { pos++; return parseFactor(); }
      if (c === '-') { pos++; var f = parseFactor(); return { value: -f.value, percent: f.percent }; }
      if (c === '(') {
        pos++;
        var v = parseExpr();
        skipSpace();
        if (peek() !== ')') throw new Error('bad expression');
        pos++;
        return applyPercentSuffix_(v);
      }
      return applyPercentSuffix_(parseNumber());
    }
    function applyPercentSuffix_(v) {
      skipSpace();
      if (peek() === '%') { pos++; return { value: v / 100, percent: true }; }
      return { value: v, percent: false };
    }
    function parseNumber() {
      skipSpace();
      var start = pos;
      while (/[0-9.]/.test(s.charAt(pos))) pos++;
      if (pos === start) throw new Error('bad expression');
      var v = parseFloat(s.slice(start, pos));
      if (isNaN(v)) throw new Error('bad expression');
      return v;
    }
    try {
      var result = parseExpr();
      skipSpace();
      if (pos !== s.length) throw new Error('bad expression');
      if (!isFinite(result)) throw new Error('bad expression');
      return { value: result, error: false };
    } catch (e) {
      return { value: 0, error: true };
    }
  }

  /** Trims float noise (0.1+0.2) and adds thousands separators, without forcing decimal places a whole-number result doesn't need. */
  function calcFormatNumber_(n) {
    var rounded = Math.round((n + Number.EPSILON) * 1e6) / 1e6;
    return rounded.toLocaleString(undefined, { maximumFractionDigits: 6 });
  }

  function calcTotal_() {
    var sum = 0;
    calcLines_.forEach(function (expr) {
      var r = calcEvaluate_(expr);
      if (!r.error && expr.trim() !== '') sum += r.value;
    });
    var el = document.getElementById('calcTotalValue');
    if (el) el.textContent = calcFormatNumber_(sum);
  }

  /** Full rebuild of the line list — used for add/remove/clear/load, where losing focus is expected anyway. Single-line edits go through calcOnLineInput_ instead so typing doesn't get interrupted. */
  function calcRender_() {
    var container = document.getElementById('calcLines');
    if (!container) return;
    container.innerHTML = calcLines_.map(function (expr, i) {
      var r = calcEvaluate_(expr);
      var trimmed = expr.trim();
      var resultText = trimmed === '' ? '' : (r.error ? 'err' : '= ' + calcFormatNumber_(r.value));
      return '<div class="calc-line" data-idx="' + i + '">' +
        '<span class="calc-line-no">' + (i + 1) + '</span>' +
        '<input type="text" inputmode="none" readonly aria-readonly="true" autocomplete="off" spellcheck="false" class="calc-line-input' + (r.error && trimmed !== '' ? ' has-error' : '') + '" value="' + escapeHtml(expr) + '" placeholder="Tap calculator keys">' +
        '<span class="calc-line-result">' + escapeHtml(resultText) + '</span>' +
        '<button type="button" class="calc-line-remove" aria-label="Remove line">&times;</button>' +
        '</div>';
    }).join('');
    calcTotal_();
    if (calcActiveIdx_ >= calcLines_.length) calcActiveIdx_ = calcLines_.length - 1;
    if (calcActiveIdx_ < 0) calcActiveIdx_ = 0;
    Array.prototype.forEach.call(container.querySelectorAll('.calc-line'), function (rowEl) {
      var idx = Number(rowEl.getAttribute('data-idx'));
      var input = rowEl.querySelector('.calc-line-input');
      input.addEventListener('input', function () { calcOnLineInput_(idx, input.value); });
      input.addEventListener('keydown', function (e) { calcOnLineKeydown_(idx, e); });
      input.addEventListener('focus', function () { calcActiveIdx_ = idx; });
      input.addEventListener('pointerdown', function (e) {
        // Touch calculator mode: select the line without opening Android/iOS soft keyboard.
        if (e.pointerType === 'touch' || e.pointerType === 'pen') {
          e.preventDefault();
          calcActiveIdx_ = idx;
          calcMoveCursorToEnd_(input);
        }
      });
      input.addEventListener('click', function () {
        calcActiveIdx_ = idx;
        calcMoveCursorToEnd_(input);
      });
      rowEl.querySelector('.calc-line-remove').addEventListener('click', function () { calcRemoveLine_(idx); });
    });
  }

  /** Updates one line's stored expression + its own result in place, so typing never loses focus or cursor position the way a full calcRender_() would. */
  function calcOnLineInput_(idx, value) {
    calcLines_[idx] = value;
    var container = document.getElementById('calcLines');
    var rowEl = container && container.querySelector('.calc-line[data-idx="' + idx + '"]');
    if (rowEl) {
      var r = calcEvaluate_(value);
      var trimmed = value.trim();
      rowEl.querySelector('.calc-line-result').textContent = trimmed === '' ? '' : (r.error ? 'err' : '= ' + calcFormatNumber_(r.value));
      rowEl.querySelector('.calc-line-input').classList.toggle('has-error', !!r.error && trimmed !== '');
    }
    calcTotal_();
    calcSave_();
  }

  function calcMoveCursorToEnd_(input) {
    if (!input) return;
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (err) { /* readonly input selection can fail in old browsers */ }
  }

  /** Keep the active calculator row visible inside the scrollable line list without moving the page behind the fixed calculator panel. */
  function calcEnsureLineVisible_(rowEl) {
    var container = document.getElementById('calcLines');
    if (!container || !rowEl) return;
    var containerRect = container.getBoundingClientRect();
    var rowRect = rowEl.getBoundingClientRect();
    var padding = 6;
    if (rowRect.bottom > containerRect.bottom) {
      container.scrollTop += rowRect.bottom - containerRect.bottom + padding;
    } else if (rowRect.top < containerRect.top) {
      container.scrollTop -= containerRect.top - rowRect.top + padding;
    }
  }

  function calcFocusLine_(idx) {
    // Update the logical destination immediately. Previously this happened
    // inside a 30ms timeout, so fast typing after Enter could still modify
    // the previous row before the new row became active.
    idx = Math.max(0, Math.min(Number(idx) || 0, calcLines_.length - 1));
    calcActiveIdx_ = idx;

    var container = document.getElementById('calcLines');
    var rowEl = container && container.querySelector('.calc-line[data-idx="' + idx + '"]');
    var input = rowEl && rowEl.querySelector('.calc-line-input');
    if (!input) return;

    // The input stays readonly + inputmode=none so Android/tablet soft
    // keyboards do not open. Explicitly reveal the focused row because
    // preventScroll otherwise leaves newly-added rows below the viewport.
    try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    calcMoveCursorToEnd_(input);
    calcEnsureLineVisible_(rowEl);
  }

  function calcAddLine_() {
    calcLines_.push('');
    calcRender_();
    calcSave_();
    calcFocusLine_(calcLines_.length - 1);
  }

  /** Removing the only remaining line just clears it instead, so there's always at least one row to type into. */
  function calcRemoveLine_(idx) {
    if (calcLines_.length <= 1) {
      calcLines_ = [''];
      calcRender_();
      calcSave_();
      calcFocusLine_(0);
      return;
    }
    calcLines_.splice(idx, 1);
    calcRender_();
    calcSave_();
    calcFocusLine_(Math.max(0, idx - 1));
  }

  /** Enter appends/advances a line like a spreadsheet; Backspace on an already-empty line merges it away, same as a text editor. */
  function calcOnLineKeydown_(idx, e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (idx === calcLines_.length - 1) calcAddLine_();
      else calcFocusLine_(idx + 1);
      return;
    }
    if (e.key === 'Backspace' && calcLines_[idx] === '' && idx > 0) {
      e.preventDefault();
      calcRemoveLine_(idx);
    }
  }

  /** Keeps calcActiveIdx_ in range after lines are added/removed elsewhere (e.g. the header Clear button), so the keypad always has a real line to type into. */
  function calcClampActiveIdx_() {
    if (calcActiveIdx_ >= calcLines_.length) calcActiveIdx_ = calcLines_.length - 1;
    if (calcActiveIdx_ < 0) calcActiveIdx_ = 0;
    return calcActiveIdx_;
  }

  function calcActiveLineInput_() {
    var idx = calcClampActiveIdx_();
    var container = document.getElementById('calcLines');
    var rowEl = container && container.querySelector('.calc-line[data-idx="' + idx + '"]');
    return rowEl ? rowEl.querySelector('.calc-line-input') : null;
  }

  /**
   * Touch-keypad equivalents of typing into the active line: insert at the
   * cursor, backspace one character (or the current selection), or clear
   * the whole line. wireCalcKeypad_() keeps focus on the input via
   * mousedown/preventDefault, so selectionStart/End still reflect where the
   * user last placed the cursor when these run.
   */
  function calcKeypadInsert_(text) {
    var idx = calcClampActiveIdx_();
    var input = calcActiveLineInput_();
    if (!input) return;
    var start = input.selectionStart != null ? input.selectionStart : input.value.length;
    var end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
    var newValue = input.value.slice(0, start) + text + input.value.slice(end);
    input.value = newValue;
    var newPos = start + text.length;
    try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    try { input.setSelectionRange(newPos, newPos); } catch (err) { /* ignore selection failure */ }
    calcOnLineInput_(idx, newValue);
  }
  function calcKeypadBackspace_() {
    var idx = calcClampActiveIdx_();
    var input = calcActiveLineInput_();
    if (!input) return;
    var start = input.selectionStart != null ? input.selectionStart : input.value.length;
    var end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
    var newValue, newPos;
    if (start !== end) { newValue = input.value.slice(0, start) + input.value.slice(end); newPos = start; }
    else if (start > 0) { newValue = input.value.slice(0, start - 1) + input.value.slice(start); newPos = start - 1; }
    else { newValue = input.value; newPos = 0; }
    input.value = newValue;
    try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    try { input.setSelectionRange(newPos, newPos); } catch (err) { /* ignore selection failure */ }
    calcOnLineInput_(idx, newValue);
  }
  function calcKeypadClearLine_() {
    var idx = calcClampActiveIdx_();
    var input = calcActiveLineInput_();
    if (!input) return;
    input.value = '';
    try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
    calcOnLineInput_(idx, '');
  }
  /** Same as pressing Enter in the active line: advance to the next line, or open a new one if it's the last. */
  function calcKeypadEnter_() {
    var idx = calcClampActiveIdx_();
    if (idx === calcLines_.length - 1) calcAddLine_();
    else calcFocusLine_(idx + 1);
  }

  /** One-time wiring for the static keypad grid — its buttons never change, so unlike calc-lines this doesn't need rewiring on every calcRender_(). */
  function wireCalcKeypad_() {
    var keypad = document.getElementById('calcKeypad');
    if (!keypad) return;
    // Without this, tapping a key blurs the line input first and the
    // insert/backspace helpers above lose selectionStart/End.
    keypad.addEventListener('mousedown', function (e) {
      if (e.target.closest && e.target.closest('.calc-key')) e.preventDefault();
    });
    keypad.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.calc-key') : null;
      if (!btn) return;
      var action = btn.getAttribute('data-action');
      var value = btn.getAttribute('data-value');
      if (action === 'digit' || action === 'op') calcKeypadInsert_(value);
      else if (action === 'paren-open') calcKeypadInsert_('(');
      else if (action === 'paren-close') calcKeypadInsert_(')');
      else if (action === 'percent') calcKeypadInsert_('%');
      else if (action === 'backspace') calcKeypadBackspace_();
      else if (action === 'clear-line') calcKeypadClearLine_();
      else if (action === 'equals') calcKeypadEnter_();
    });
  }


  /** Desktop/laptop keyboard support while keeping mobile/tablet inputs touch-only.
   *  The line input stays readonly + inputmode=none so Android does not open the
   *  soft keyboard, but physical keyboard keys are handled here when the panel is open.
   */
  function calcHandlePhysicalKey_(e) {
    var panel = document.getElementById('calcPanel');
    if (!panel || panel.hidden) return;

    var key = e.key;
    if (/^[0-9]$/.test(key)) {
      e.preventDefault();
      calcKeypadInsert_(key);
      return;
    }

    var insertMap = {
      '+': '+',
      '-': '-',
      '*': '×',
      'x': '×',
      'X': '×',
      '/': '÷',
      '.': '.',
      ',': '.',
      '(': '(',
      ')': ')',
      '%': '%'
    };

    if (Object.prototype.hasOwnProperty.call(insertMap, key)) {
      e.preventDefault();
      calcKeypadInsert_(insertMap[key]);
      return;
    }

    if (key === 'Enter' || key === '=') {
      e.preventDefault();
      calcKeypadEnter_();
      return;
    }

    if (key === 'Backspace') {
      e.preventDefault();
      calcKeypadBackspace_();
      return;
    }

    if (key === 'Delete') {
      e.preventDefault();
      calcKeypadClearLine_();
    }
  }

  function calcOpen_() {
    var panel = document.getElementById('calcPanel');
    var btn = document.getElementById('calcToggleBtn');
    if (!panel) return;
    panel.hidden = false;
    if (btn) { btn.classList.add('is-active'); btn.setAttribute('aria-expanded', 'true'); }
    calcActiveIdx_ = calcLines_.length - 1;
    calcFocusLine_(calcLines_.length - 1);
  }
  function calcClose_() {
    var panel = document.getElementById('calcPanel');
    var btn = document.getElementById('calcToggleBtn');
    if (!panel) return;
    panel.hidden = true;
    if (btn) { btn.classList.remove('is-active'); btn.setAttribute('aria-expanded', 'false'); }
  }

  /** One-time wiring, called from the DOMContentLoaded handler above regardless of login state — the button/panel simply sit inside #app, hidden with the rest of the shell until sign-in. */
  function wireCalcPanel_() {
    var toggleBtn = document.getElementById('calcToggleBtn');
    var panel = document.getElementById('calcPanel');
    if (!toggleBtn || !panel) return;

    calcLoad_();
    calcRender_();
    wireCalcKeypad_();

    toggleBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (panel.hidden) calcOpen_(); else calcClose_();
    });
    var closeBtn = document.getElementById('calcCloseBtn');
    if (closeBtn) closeBtn.addEventListener('click', calcClose_);
    var clearBtn = document.getElementById('calcClearBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', function () {
        calcLines_ = [''];
        calcRender_();
        calcSave_();
        calcFocusLine_(0);
      });
    }

    document.addEventListener('click', function (e) {
      if (panel.hidden) return;
      if (panel.contains(e.target) || toggleBtn.contains(e.target)) return;
      calcClose_();
    });
    document.addEventListener('keydown', function (e) {
      if (panel.hidden) return;
      if (e.key === 'Escape') {
        calcClose_();
        return;
      }
      // Enter / empty-line Backspace can already be handled by the focused
      // line's keydown listener. Do not process the same physical key twice
      // when that event bubbles up to the document.
      if (e.defaultPrevented) return;
      calcHandlePhysicalKey_(e);
    });
  }

  // ---------------- 7. Compact invoice print engine ----------------
  // Font stack for the canvas receipt. Must mirror --font-bn in style.html:
  // canvas ctx.font takes a CSS font-family list but cannot read a CSS
  // custom property, so this one string is the unavoidable duplicate.
  var RECEIPT_FONT_STACK = '"Noto Sans Bengali", "Inter", "Nirmala UI", "Shonar Bangla", ' +
    'Vrinda, "Kohinoor Bangla", "Bangla Sangam MN", "Bangla MN", ' +
    'SolaimanLipi, Kalpurush, "Siyam Rupali", sans-serif';

  // Shared across the on-screen/print HTML (render*_ below), the thermal
  // roll (same builders, narrower CSS) and the JPG receipt (buildReceiptCanvas_),
  // so labels can never drift apart the way the date formatters once did.
  //
  // Time is deliberately NOT shown on the invoice — date only. The Sales
  // sheet still records a 'Time' column on every sale and Day Book still
  // displays it; this is a presentation choice, not a data change.
  var BN = {
    date: 'তারিখ',           status: 'অবস্থা',
    customer: 'ক্রেতা',       phone: 'মোবাইল',
    address: 'ঠিকানা',        item: 'পণ্যের নাম',
    qty: 'পরিমাণ',            price: 'দর',
    lineTotal: 'টাকা',
    subtotal: 'সাব-টোটাল',    discount: 'ছাড়',
    grandTotal: 'সর্বমোট',    paid: 'জমা',
    customerCredit: 'কাস্টমার ক্রেডিট',
    due: 'বকেয়া',            walkIn: 'খুচরা ক্রেতা'
  };

  // Payment Status is stored in English on the sheet; only the display translates.
  var BN_STATUS = { 'Paid': 'পরিশোধিত', 'Partial': 'আংশিক', 'Due': 'বাকি' };

  var BN_MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
                   'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];

  var BN_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  /** Rows per printed A4 page. Tuned against --inv-row-h (26px) and the compact header/totals in style.html so a single-page invoice (everything present) still fits inside the 277mm usable height from @page{margin:10mm} — see style.html's Invoice section for the math. */
  var INVOICE_ROWS_PER_PAGE = 24;

  /** '2026-08-05' -> '২০২৬-০৮-০৫'. Only digits change; separators and text pass through. */
  function toBn_(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/[0-9]/g, function (d) { return BN_DIGITS[Number(d)]; });
  }

  /** Money with Bangla numerals: 1234.5 -> '৳১,২৩৪.৫'. Grouping stays Western, which is what shop software in BD uses. */
  function bnMoney_(amount, symbol) {
    var n = Number(amount) || 0;
    return (symbol || '') + toBn_(n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }));
  }

  /** 'yyyy-MM-dd' (or any parseable date) -> '০৫ আগস্ট ২০২৬'. Falls back to the raw value if unparseable. */
  function formatInvoiceDate_(dateStr) {
    if (!dateStr) return '';
    var parts = String(dateStr).split('-');
    var d;
    if (parts.length === 3 && parts[0].length === 4) {
      // Building from parts avoids the UTC-parse day-shift trap that plain
      // date strings hit in new Date() — the same trap DayBook.gs warns about.
      d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    } else {
      d = new Date(dateStr);
    }
    if (isNaN(d.getTime())) return String(dateStr);
    var day = ('0' + d.getDate()).slice(-2);   // zero-padded: ০৫, not ৫
    return toBn_(day) + ' ' + BN_MONTHS[d.getMonth()] + ' ' + toBn_(d.getFullYear());
  }

  // 0-99 in idiomatic Bangla number-words (irregular, like Hindi — not a
  // simple tens+ones concatenation). Used only by bnAmountInWords_ below.
  var BN_NUM_WORDS_ = ['শূন্য', 'এক', 'দুই', 'তিন', 'চার', 'পাঁচ', 'ছয়', 'সাত', 'আট', 'নয়',
    'দশ', 'এগারো', 'বারো', 'তেরো', 'চৌদ্দ', 'পনের', 'ষোল', 'সতের', 'আঠারো', 'উনিশ',
    'বিশ', 'একুশ', 'বাইশ', 'তেইশ', 'চব্বিশ', 'পঁচিশ', 'ছাব্বিশ', 'সাতাশ', 'আঠাশ', 'ঊনত্রিশ',
    'ত্রিশ', 'একত্রিশ', 'বত্রিশ', 'তেত্রিশ', 'চৌত্রিশ', 'পঁয়ত্রিশ', 'ছত্রিশ', 'সাঁইত্রিশ', 'আটত্রিশ', 'ঊনচল্লিশ',
    'চল্লিশ', 'একচল্লিশ', 'বিয়াল্লিশ', 'তেতাল্লিশ', 'চুয়াল্লিশ', 'পঁয়তাল্লিশ', 'ছেচল্লিশ', 'সাতচল্লিশ', 'আটচল্লিশ', 'ঊনপঞ্চাশ',
    'পঞ্চাশ', 'একান্ন', 'বায়ান্ন', 'তিপ্পান্ন', 'চুয়ান্ন', 'পঞ্চান্ন', 'ছাপ্পান্ন', 'সাতান্ন', 'আটান্ন', 'ঊনষাট',
    'ষাট', 'একষট্টি', 'বাষট্টি', 'তেষট্টি', 'চৌষট্টি', 'পঁয়ষট্টি', 'ছেষট্টি', 'সাতষট্টি', 'আটষট্টি', 'ঊনসত্তর',
    'সত্তর', 'একাত্তর', 'বাহাত্তর', 'তিয়াত্তর', 'চুয়াত্তর', 'পঁচাত্তর', 'ছিয়াত্তর', 'সাতাত্তর', 'আটাত্তর', 'ঊনআশি',
    'আশি', 'একাশি', 'বিরাশি', 'তিরাশি', 'চুরাশি', 'পঁচাশি', 'ছিয়াশি', 'সাতাশি', 'আটাশি', 'ঊননব্বই',
    'নব্বই', 'একানব্বই', 'বিরানব্বই', 'তিরানব্বই', 'চুরানব্বই', 'পঁচানব্বই', 'ছিয়ানব্বই', 'সাতানব্বই', 'আটানব্বই', 'নিরানব্বই'];

  /** ৳15800 -> 'পনের হাজার আট শত টাকা মাত্র'. Whole taka only — invoices here don't carry paisa. */
  function bnAmountInWords_(amount) {
    var n = Math.round(Number(amount) || 0);
    if (n <= 0) return '';
    var crore = Math.floor(n / 10000000); n %= 10000000;
    var lakh = Math.floor(n / 100000); n %= 100000;
    var thousand = Math.floor(n / 1000); n %= 1000;
    var hundred = Math.floor(n / 100); n %= 100;
    var rest = n;
    var parts = [];
    if (crore) parts.push(BN_NUM_WORDS_[crore] + ' কোটি');
    if (lakh) parts.push(BN_NUM_WORDS_[lakh] + ' লক্ষ');
    if (thousand) parts.push(BN_NUM_WORDS_[thousand] + ' হাজার');
    if (hundred) parts.push(BN_NUM_WORDS_[hundred] + ' শত');
    if (rest) parts.push(BN_NUM_WORDS_[rest]);
    return parts.join(' ') + ' টাকা মাত্র';
  }

  /* ---- Component builders ----------------------------------------------
   * Each takes the invoice payload (buildInvoicePayload_'s shape) and
   * returns an HTML fragment, or '' when the section is disabled or has
   * no data. renderInvoiceHtml_/renderInvoiceHtmlThermal_ below just filter
   * out the empties and join what's left — no section ever reserves space
   * it isn't using, per the "enabled AND has data, else skip" rule.
   * ---------------------------------------------------------------------- */

  function buildInvBismillah_(inv) {
    if (!inv.shop.showBismillah) return '';
    var text = String(inv.shop.bismillahText || '').trim();
    if (!text) return '';
    return '<div class="inv-bismillah" dir="auto">' + escapeHtml(text) + '</div>';
  }

  /** Logo (if any) + shop name/proprietor/description on the left, address/phones on the right. Max height is enforced by CSS (--inv-header-max-h), not here. */
  function buildInvHeader_(inv) {
    var shop = inv.shop;
    var shopName = shop.nameBangla || shop.name || '';
    var brand = '<div class="inv-header-brand">' +
      (shop.logoDataUri ? '<img class="inv-logo" src="' + escapeHtml(shop.logoDataUri) + '" alt="Logo">' : '') +
      '<div>' +
        '<h1 class="inv-shop-name">' + escapeHtml(shopName) + '</h1>' +
        (shop.proprietorName ? '<div class="inv-proprietor">প্রোপাইটর: ' + escapeHtml(shop.proprietorName) + '</div>' : '') +
        (shop.proprietorParagraph ? '<em class="inv-proprietor-paragraph" dir="auto">' + escapeHtml(shop.proprietorParagraph) + '</em>' : '') +
        (shop.description ? '<div class="inv-shop-desc">' + escapeHtml(shop.description) + '</div>' : '') +
      '</div>' +
    '</div>';

    var sideParts = [];
    if (shop.address) sideParts.push('<div class="inv-address">' + escapeHtml(shop.address) + '</div>');
    if (shop.phone1) sideParts.push('<div class="inv-phone">' + toBn_(escapeHtml(shop.phone1)) + '</div>');
    if (shop.phone2) sideParts.push('<div class="inv-phone">' + toBn_(escapeHtml(shop.phone2)) + '</div>');
    var side = sideParts.length ? '<div class="inv-header-side">' + sideParts.join('') + '</div>' : '';

    return '<header class="inv-header">' + brand + side + '</header>';
  }

  /** Compact single line: "চালান নং : ...   তারিখ : ...". Only the first page of a multi-page invoice. */
  function buildInvInfoRow_(inv) {
    var titleLabel = escapeHtml(inv.shop.invoiceTitle || 'চালান');
    var parts = [
      '<span><b>' + titleLabel + ' নং</b> : ' + escapeHtml(inv.invoiceId) + '</span>',
      '<span><b>' + BN.date + '</b> : ' + escapeHtml(formatInvoiceDate_(inv.date)) + '</span>'
    ];
    if (inv.dueDate) parts.push('<span><b>পরিশোধের শেষ তারিখ</b> : ' + escapeHtml(formatInvoiceDate_(inv.dueDate)) + '</span>');
    if (inv.shop.paymentTermsText) parts.push('<span><b>শর্ত</b> : ' + escapeHtml(inv.shop.paymentTermsText) + '</span>');
    return '<div class="inv-info-row">' + parts.join('') + '</div>';
  }

  /** Name always shows (defaulting to "খুচরা ক্রেতা" for walk-ins); father/mobile/address only when present. */
  function buildInvCustomer_(inv) {
    var meta = [];
    if (inv.customerFatherName) meta.push('<span>পিতা: ' + escapeHtml(inv.customerFatherName) + '</span>');
    if (inv.customerPhone) meta.push('<span>' + BN.phone + ': ' + toBn_(escapeHtml(inv.customerPhone)) + '</span>');
    if (inv.customerAddress) meta.push('<span>' + BN.address + ': ' + escapeHtml(inv.customerAddress) + '</span>');
    return '<div class="inv-customer">' +
      '<div class="inv-customer-name">নামঃ ' + escapeHtml(inv.customerName || BN.walkIn) + '</div>' +
      (meta.length ? '<div class="inv-customer-meta">' + meta.join('') + '</div>' : '') +
    '</div>';
  }

  /** Billed-to (left) and চালান নং/তারিখ (right) share one row, horizontally aligned, below the header line. */
  function buildInvCustomerInfoRow_(inv) {
    return '<div class="inv-customer-info-row">' + buildInvCustomer_(inv) + buildInvInfoRow_(inv) + '</div>';
  }

  /** নং / পণ্যের নাম / পরিমাণ / একক / দর / টাকা. startIndex lets নং keep counting across pages instead of resetting each page. */
  function buildInvTable_(items, sym, startIndex) {
    var rows = items.map(function (i, idx) {
      return '<tr>' +
        '<td class="idx">' + toBn_(startIndex + idx + 1) + '</td>' +
        '<td class="name">' + escapeHtml(i.name) + '</td>' +
        '<td class="num">' + toBn_(i.qty) + '</td>' +
        '<td class="num">' + escapeHtml(i.unit || '') + '</td>' +
        '<td class="num">' + bnMoney_(i.unitPrice, sym) + '</td>' +
        '<td class="num">' + bnMoney_(i.lineTotal, sym) + '</td>' +
      '</tr>';
    }).join('');
    return '<table class="inv-table"><thead><tr>' +
      '<th>নং</th><th>' + BN.item + '</th><th class="num">' + BN.qty + '</th>' +
      '<th class="num">একক</th><th class="num">' + BN.price + '</th><th class="num">' + BN.lineTotal + '</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  /** Payment-method chips, bolding whichever one matches how this specific sale was actually paid (inv.paymentMethod/bankAccountName) rather than always the first entry admin listed. */
  function buildInvPaymentMethods_(inv) {
    var methods;
    try { methods = JSON.parse(inv.shop.paymentMethods || '[]'); } catch (e) { methods = []; }
    if (!Array.isArray(methods) || !methods.length) return '';
    var usedNeedle = (paymentMethodNeedsAccount_(inv.paymentMethod) ? (inv.bankAccountName || '') : (inv.paymentMethod === 'Cash' ? 'cash' : '')).toLowerCase();
    var chips = methods.map(function (m) {
      var label = m.label || '';
      var value = m.value || '';
      var haystack = (label + ' ' + value).toLowerCase();
      var isUsed = usedNeedle && (haystack.indexOf(usedNeedle) !== -1 ||
        (inv.paymentMethod === 'Cash' && (haystack.indexOf('ক্যাশ') !== -1 || haystack.indexOf('নগদ') !== -1)));
      return '<div class="inv-payment-chip' + (isUsed ? ' used' : '') + '">' + escapeHtml(label) + (value ? ' ' + escapeHtml(value) : '') + '</div>';
    }).join('');
    return '<div><div class="inv-side-label">সেন্ড-মানি</div><div class="inv-payment-methods">' + chips + '</div></div>';
  }

  function buildInvTerms_(inv) {
    var terms;
    try { terms = JSON.parse(inv.shop.terms || '[]'); } catch (e) { terms = []; }
    if (!Array.isArray(terms) || !terms.length) return '';
    var lis = terms.map(function (t) { return '<li>' + escapeHtml(t.text || t) + '</li>'; }).join('');
    return '<div><div class="inv-side-label">শর্তাবলী</div><ul class="inv-terms">' + lis + '</ul></div>';
  }

  function buildInvTotalsPanel_(inv) {
    var sym = inv.shop.currencySymbol;
    var discount = Number(inv.discount) || 0;
    var paid = Number(inv.paidAmount) || 0;
    var customerCreditUsed = Number(inv.customerCreditUsed) || 0;
    var moneyPaid = Math.max(0, paid - customerCreditUsed);
    var due = Number(inv.dueAmount) || 0;
    var grand = Number(inv.grandTotal) || 0;

    var rows = '<div class="inv-total-row"><span>' + BN.subtotal + '</span><span class="v">' + bnMoney_(inv.subtotal, sym) + '</span></div>';
    if (discount > 0) rows += '<div class="inv-total-row"><span>' + BN.discount + '</span><span class="v">− ' + bnMoney_(discount, sym) + '</span></div>';
    rows += '<div class="inv-total-row grand"><span>' + BN.grandTotal + '</span><span class="v">' + bnMoney_(grand, sym) + '</span></div>';
    if (customerCreditUsed > 0) rows += '<div class="inv-total-row"><span>' + BN.customerCredit + '</span><span class="v">− ' + bnMoney_(customerCreditUsed, sym) + '</span></div>';
    if (moneyPaid > 0) rows += '<div class="inv-total-row"><span>' + BN.paid + '</span><span class="v">− ' + bnMoney_(moneyPaid, sym) + '</span></div>';
    if (due > 0) rows += '<div class="inv-total-row due"><span>' + BN.due + '</span><span class="v">' + bnMoney_(due, sym) + '</span></div>';

    // Always the grand total, per the brief's "final payable amount" — not
    // the outstanding due, which is a partial-payment detail, not the
    // invoice's own amount-in-words line.
    var words = bnAmountInWords_(grand);
    var wordsHtml = words ? '<div class="inv-words">কথায়ঃ ' + escapeHtml(words) + '</div>' : '';

    return '<div class="inv-totals">' + rows + wordsHtml + '</div>';
  }

  /** Payment/terms (left) + totals (right) — only the last page of a multi-page invoice. */
  function buildInvBottom_(inv) {
    var sideParts = [buildInvPaymentMethods_(inv), buildInvTerms_(inv)].filter(function (s) { return s; });
    var side = sideParts.length ? '<div class="inv-side">' + sideParts.join('') + '</div>' : '';
    return '<div class="inv-bottom">' + side + buildInvTotalsPanel_(inv) + '</div>';
  }

  function buildInvDraftMark_(inv) {
    return inv && inv.isDraft ? '<div class="inv-draft-mark"><strong>DRAFT</strong><span>খসড়া</span></div>' : '';
  }

  /** Automatic — Due == 0 and there's actually an amount owed in the first place. No setting; nothing to disable. */
  function buildInvPaidBadge_(inv) {
    if (inv.isDraft) return '';
    var due = Number(inv.dueAmount) || 0;
    var grand = Number(inv.grandTotal) || 0;
    if (due !== 0 || grand <= 0) return '';
    return '<div class="inv-paid-badge">পরিশোধিত</div>';
  }

  function buildInvSignatures_(inv) {
    if (!inv.shop.showSignature) return '';
    return '<div class="inv-signatures">' +
      '<div class="inv-signature">ক্রেতার স্বাক্ষর</div>' +
      '<div class="inv-signature">বিক্রেতার স্বাক্ষর</div>' +
    '</div>';
  }

  function buildInvFooter_(inv) {
    if (!inv.shop.footer) return '';
    return '<div class="inv-footer-text">' + escapeHtml(inv.shop.footer) + '</div>';
  }

  /** Wraps signatures + footer text together so CSS (.inv-footer-block's margin-top:auto in style.html) can anchor just this pair to the bottom of the page — .inv-bottom's payment/terms/totals stay in normal flow right after the table, not pushed down with them. */
  function buildInvFooterBlock_(inv) {
    var parts = [buildInvSignatures_(inv), buildInvFooter_(inv)].filter(function (s) { return s; });
    if (!parts.length) return '';
    return '<div class="inv-footer-block">' + parts.join('') + '</div>';
  }

  /**
   * The one on-screen/print/PDF layout, A4 or thermal, single-page or
   * multi-page — all the same component builders above, just sliced
   * differently. items.length > INVOICE_ROWS_PER_PAGE produces several
   * stacked .invoice-page divs; style.html's print rule turns those into
   * separate physical pages, repeating the header + table header on each
   * and keeping totals/signature/footer on the last one only.
   */
  function renderInvoiceHtml_(inv) {
    var items = inv.items || [];
    var pageCount = Math.max(1, Math.ceil(items.length / INVOICE_ROWS_PER_PAGE));
    var pages = [];
    for (var p = 0; p < pageCount; p++) {
      var isFirst = p === 0;
      var isLast = p === pageCount - 1;
      var pageItems = items.slice(p * INVOICE_ROWS_PER_PAGE, (p + 1) * INVOICE_ROWS_PER_PAGE);
      var headerParts = [
        buildInvBismillah_(inv),
        buildInvHeader_(inv),
        isFirst ? buildInvCustomerInfoRow_(inv) : ''
      ].filter(function (s) { return s; }).join('');
      var body = [
        '<div class="inv-header-block">' + headerParts + '</div>',
        buildInvTable_(pageItems, inv.shop.currencySymbol, p * INVOICE_ROWS_PER_PAGE)
      ];
      if (isLast) {
        body.push(buildInvBottom_(inv));
        body.push(buildInvFooterBlock_(inv));
      }
      var badge = isLast ? buildInvPaidBadge_(inv) : '';
      pages.push('<div class="invoice-page">' + buildInvDraftMark_(inv) + body.filter(function (s) { return s; }).join('') + badge + '</div>');
    }
    return pages.join('');
  }

  /* Thermal receipt deliberately has its own compact presentation. It reads
   * the same invoice payload as A4/JPG but excludes long A4-only branding,
   * payment chips, terms, amount-in-words and signatures so a shop receipt
   * stays usable on both 58mm and 80mm paper. No sale/accounting data changes. */
  function buildInvThermalHeader_(inv) {
    var shop = inv.shop || {};
    var name = shop.nameBangla || shop.name || '';
    var contacts = [];
    if (shop.address) contacts.push('<div class="thermal-shop-address">' + escapeHtml(shop.address) + '</div>');
    var phones = [shop.phone1, shop.phone2].filter(Boolean).map(function (p) { return toBn_(escapeHtml(p)); });
    if (phones.length) contacts.push('<div class="thermal-shop-phone">' + phones.join(' · ') + '</div>');
    return '<div class="thermal-head">' +
      '<div class="thermal-shop-name">' + escapeHtml(name) + '</div>' + contacts.join('') +
      '</div>';
  }

  function buildInvThermalMeta_(inv) {
    var title = escapeHtml((inv.shop && inv.shop.invoiceTitle) || 'চালান');
    var customer = escapeHtml(inv.customerName || BN.walkIn);
    var rows = [
      '<div><span>' + title + '</span><b>' + escapeHtml(inv.invoiceId) + '</b></div>',
      '<div><span>' + BN.date + '</span><span>' + escapeHtml(formatInvoiceDate_(inv.date)) + '</span></div>',
      '<div><span>নাম</span><span>' + customer + '</span></div>'
    ];
    if (inv.customerPhone) rows.push('<div><span>' + BN.phone + '</span><span>' + toBn_(escapeHtml(inv.customerPhone)) + '</span></div>');
    return '<div class="thermal-meta">' + rows.join('') + '</div>';
  }

  function buildInvThermalItems_(inv) {
    var sym = (inv.shop && inv.shop.currencySymbol) || '';
    var rows = (inv.items || []).map(function (item) {
      return '<div class="thermal-item">' +
        '<div class="thermal-item-name">' + escapeHtml(item.name || '') + '</div>' +
        '<div class="thermal-item-detail">' +
          '<span>' + toBn_(item.qty) + ' × ' + bnMoney_(item.unitPrice, sym) + '</span>' +
          '<b>' + bnMoney_(item.lineTotal, sym) + '</b>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div class="thermal-items"><div class="thermal-items-head"><span>' + BN.item + '</span><span>' + BN.lineTotal + '</span></div>' + rows + '</div>';
  }

  function buildInvThermalTotals_(inv) {
    var sym = (inv.shop && inv.shop.currencySymbol) || '';
    var discount = Number(inv.discount) || 0;
    var paid = Number(inv.paidAmount) || 0;
    var customerCreditUsed = Number(inv.customerCreditUsed) || 0;
    var moneyPaid = Math.max(0, paid - customerCreditUsed);
    var due = Number(inv.dueAmount) || 0;
    var grand = Number(inv.grandTotal) || 0;
    var rows = '<div><span>' + BN.subtotal + '</span><span>' + bnMoney_(inv.subtotal, sym) + '</span></div>';
    if (discount > 0) rows += '<div><span>' + BN.discount + '</span><span>− ' + bnMoney_(discount, sym) + '</span></div>';
    rows += '<div class="thermal-grand"><span>' + BN.grandTotal + '</span><b>' + bnMoney_(grand, sym) + '</b></div>';
    if (customerCreditUsed > 0) rows += '<div><span>' + BN.customerCredit + '</span><span>− ' + bnMoney_(customerCreditUsed, sym) + '</span></div>';
    if (moneyPaid > 0) rows += '<div><span>' + BN.paid + '</span><span>− ' + bnMoney_(moneyPaid, sym) + '</span></div>';
    if (due > 0) rows += '<div class="thermal-due"><span>' + BN.due + '</span><b>' + bnMoney_(due, sym) + '</b></div>';
    return '<div class="thermal-totals">' + rows + '</div>';
  }

  function renderInvoiceHtmlThermal_(inv) {
    var draft = inv && inv.isDraft ? '<div class="thermal-draft">DRAFT / খসড়া</div>' : '';
    var body = [
      draft,
      buildInvThermalHeader_(inv),
      buildInvThermalMeta_(inv),
      buildInvThermalItems_(inv),
      buildInvThermalTotals_(inv),
      '<div class="thermal-thanks">ধন্যবাদ</div>'
    ].filter(function (part) { return part; }).join('');
    return '<div class="invoice-page thermal-page"><div class="thermal-receipt">' + body + '</div></div>';
  }

  // ---------------- 8. Browser print/PDF rendering ----------------
  /**
   * Prints just the invoice, on exactly one page.
   *
   * THE BUG THIS FIXES: the old print rule was `body * { visibility: hidden }`
   * plus `#invoiceModal, #invoiceModal * { visibility: visible }`.
   * visibility:hidden hides pixels but keeps every element's full layout
   * height — the entire app shell still occupied space in the print flow.
   * Stacked on top of that, `#app { min-height: 100vh }` guaranteed a full
   * page of height on its own, and the modal's `position: fixed; inset: 0`
   * plus 20px padding measured slightly TALLER than one sheet. So every
   * print produced the invoice on page 1 and a blank page 2.
   *
   * The invoice is now cloned into a print-only host that is a DIRECT child
   * of <body>. Printing hides every other body child outright with
   * display:none, so the document is exactly as tall as the invoice.
   *
   * thermal print does NOT clone #invoicePaper — that always holds the
   * full A4 layout (grid + mm-fixed widths), which cannot reflow into a
   * 72mm roll. Callers passing thermal=true must also pass the raw
   * invoice object so it can be re-rendered with renderInvoiceHtmlThermal_.
   */

  /**
   * Print-only A4 renderer.
   *
   * Chrome can fragment a flex footer away from its totals when one very long
   * invoice page is left to automatic pagination. Build explicit A4-sized
   * chunks instead: repeat the shop/table header, show customer details only
   * on page 1, and render totals/signature/footer only on the final page.
   * This keeps 100+ product invoices predictable without changing invoice data.
   */
  function renderInvoicePrintHtml_(inv) {
    var items = inv.items || [];
    var pageCount = Math.max(1, Math.ceil(items.length / INVOICE_ROWS_PER_PAGE));
    var pages = [];

    for (var p = 0; p < pageCount; p++) {
      var isFirst = p === 0;
      var isLast = p === pageCount - 1;
      var start = p * INVOICE_ROWS_PER_PAGE;
      var pageItems = items.slice(start, start + INVOICE_ROWS_PER_PAGE);
      var headerParts = [
        buildInvBismillah_(inv),
        buildInvHeader_(inv),
        isFirst ? buildInvCustomerInfoRow_(inv) : ''
      ].filter(function (s) { return s; }).join('');

      var body = [
        '<div class="inv-header-block">' + headerParts + '</div>',
        buildInvTable_(pageItems, inv.shop.currencySymbol, start)
      ];

      if (isLast) {
        body.push(buildInvBottom_(inv));
        body.push(buildInvFooterBlock_(inv));
      }

      pages.push('<div class="invoice-page invoice-print-page">' + buildInvDraftMark_(inv) +
        body.filter(function (s) { return s; }).join('') +
        (isLast ? buildInvPaidBadge_(inv) : '') + '</div>');
    }

    return pages.join('');
  }

  function printInvoice_(thermal, invoiceData) {
    var paper = document.getElementById('invoicePaper');
    if (!paper || !paper.innerHTML.trim()) {
      showToast('Nothing to print yet.', 'error');
      return;
    }
    if (thermal && !invoiceData) {
      showToast('Nothing to print yet.', 'error');
      return;
    }

    if (!invoiceData && typeof posState !== 'undefined' && posState && posState._lastInvoice) {
      invoiceData = posState._lastInvoice;
    }

    var contentHtml;
    if (thermal) {
      contentHtml = renderInvoiceHtmlThermal_(invoiceData);
    } else if (invoiceData) {
      contentHtml = renderInvoicePrintHtml_(invoiceData);
    } else {
      // Keep compatibility with any older caller that only rendered invoicePaper.
      // The normal POS/Sales path always has posState._lastInvoice.
      contentHtml = paper.innerHTML;
    }
    // 'Receipt Size' (58mm/80mm, set on Settings > Invoice Design) picks the
    // narrower CSS variant; see .invoice-paper.thermal.size-58 in style.html.
    var sizeClass = thermal && invoiceData.shop.receiptSize === '58mm' ? ' size-58' : '';

    var host = document.getElementById('printHost');
    if (!host) {
      host = document.createElement('div');
      host.id = 'printHost';
      document.body.appendChild(host);
    }
    host.innerHTML = '<div class="invoice-paper' + (thermal ? ' thermal' + sizeClass : '') + (invoiceData && invoiceData.isDraft ? ' is-draft' : '') + '">' + contentHtml + '</div>';

    document.body.classList.add('printing-invoice');
    try {
      window.print();
    } finally {
      // window.print() blocks until the dialog is dismissed in every browser
      // this app targets, so tearing down immediately after is safe.
      document.body.classList.remove('printing-invoice');
      host.innerHTML = '';
    }
  }

  // ---------------- 9. Canvas receipt (JPG download) ----------------
  // Drawn with text/line primitives (plus the logo image itself) only — no
  // SVG, no foreignObject. Rendering HTML into an <img> via an SVG
  // foreignObject taints the canvas in Chrome even for same-origin content,
  // which blocks toBlob() with a SecurityError. Drawing natively sidesteps
  // that entirely — the zero-CDN rule already ruled out an html2canvas-style
  // shared-markup renderer, so this stays hand-drawn rather than a literal
  // reuse of the HTML/CSS engine above. It draws from the SAME data and the
  // same enabled/has-data visibility rules as renderInvoiceHtml_ though, so
  // it's the same *design*, just a different rendering mechanism, per the
  // "shared branding — only width differs" requirement.
  function downloadInvoiceJpg_(inv) {
    buildReceiptCanvas_(inv).then(function (canvas) {
      canvas.toBlob(function (blob) {
        if (!blob) { showToast('Could not generate the image.', 'error'); return; }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = inv.invoiceId + '.jpg';
        a.click();
      }, 'image/jpeg', 0.95);
    }).catch(function (err) {
      showToast('Could not generate the image: ' + err.message, 'error');
    });
  }

  /** Loads the logo as an Image so it can be canvas.drawImage'd — resolves null (no image row drawn) if there's no logo or it fails to decode, rather than rejecting the whole receipt. */
  function loadInvoiceLogoImage_(dataUri) {
    if (!dataUri) return Promise.resolve(null);
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = dataUri;
    });
  }

  function buildReceiptCanvas_(inv) {
    return loadInvoiceLogoImage_(inv.shop.logoDataUri).then(function (logoImg) {
      return drawReceiptCanvas_(inv, logoImg);
    });
  }

  /** Wrap canvas text to a fixed width without splitting Bangla clusters. */
  function wrapCanvasText_(ctx, text, maxWidth) {
    var source = String(text === null || text === undefined ? '' : text);
    if (!source) return [''];
    var lines = [];

    function splitLongToken(token) {
      var rest = token;
      while (rest) {
        if (ctx.measureText(rest).width <= maxWidth) { lines.push(rest); break; }
        var cut = 1;
        for (var i = 2; i <= rest.length; i++) {
          if (ctx.measureText(rest.slice(0, i)).width > maxWidth) { cut = i - 1; break; }
          cut = i;
        }
        var safePrefix = bnSafeCut_(rest, Math.max(1, cut));
        if (!safePrefix) safePrefix = rest.slice(0, 1);
        lines.push(safePrefix);
        rest = rest.slice(safePrefix.length);
      }
    }

    source.split(/\r?\n/).forEach(function (paragraph) {
      var words = paragraph.trim().split(/\s+/).filter(Boolean);
      if (!words.length) { lines.push(''); return; }
      var current = '';
      words.forEach(function (word) {
        var candidate = current ? current + ' ' + word : word;
        if (ctx.measureText(candidate).width <= maxWidth) { current = candidate; return; }
        if (current) { lines.push(current); current = ''; }
        if (ctx.measureText(word).width <= maxWidth) current = word;
        else splitLongToken(word);
      });
      if (current) lines.push(current);
    });
    return lines.length ? lines : [''];
  }

  function drawReceiptCanvas_(inv, logoImg) {
    // Wider than the old 380: Bangla matras sit above and below the
    // baseline so rows need the extra room.
    var W = 420, PAD = 18, scale = 2;
    var sym = inv.shop.currencySymbol || '';
    var shop = inv.shop;
    var rows = [];

    function kvBn(label, value, size, bold) {
      rows.push({ kv: [label, value], size: size || 12, bold: !!bold });
    }

    if (shop.showBismillah && String(shop.bismillahText || '').trim()) {
      rows.push({ text: shop.bismillahText.trim(), size: 13, align: 'center' });
    }
    if (logoImg) rows.push({ logo: true });

    rows.push({ text: shop.nameBangla || shop.name, size: 18, bold: true, align: 'center' });
    if (shop.proprietorName) rows.push({ text: 'প্রোপাইটর: ' + shop.proprietorName, size: 11, align: 'center', color: '#555' });
    if (shop.proprietorParagraph) rows.push({ text: shop.proprietorParagraph, size: 10.5, align: 'center', color: '#555', italic: true });
    if (shop.description) rows.push({ text: shop.description, size: 11, align: 'center', color: '#555', wrap: true });
    if (shop.address) rows.push({ text: shop.address, size: 11, align: 'center', color: '#555' });
    var phoneLine = [shop.phone1, shop.phone2].filter(Boolean).map(toBn_).join('   ');
    if (phoneLine) rows.push({ text: phoneLine, size: 11, align: 'center', color: '#555' });
    rows.push({ rule: true });

    var titleLabel = shop.invoiceTitle || 'চালান';
    if (inv.isDraft) rows.push({ text: 'DRAFT / খসড়া', size: 14, bold: true, align: 'center', color: '#8a5a00' });
    rows.push({ text: titleLabel, size: 15, bold: true, align: 'center' });
    rows.push({ rule: true, thin: true });

    kvBn(titleLabel + ' নং', inv.invoiceId, 12, true);
    kvBn(BN.date, formatInvoiceDate_(inv.date), 12);
    kvBn(BN.status, BN_STATUS[inv.paymentStatus] || inv.paymentStatus, 12);
    rows.push({ rule: true, thin: true });

    kvBn('নামঃ', inv.customerName || BN.walkIn, 12);
    if (inv.customerFatherName) kvBn('পিতা', inv.customerFatherName, 11);
    if (inv.customerPhone) kvBn(BN.phone, toBn_(inv.customerPhone), 11);
    if (inv.customerAddress) kvBn(BN.address, inv.customerAddress, 11);
    rows.push({ rule: true });

    rows.push({ cols: [BN.item, BN.qty, BN.price, BN.lineTotal], size: 11, bold: true });
    rows.push({ rule: true, thin: true });
    (inv.items || []).forEach(function (i) {
      rows.push({
        cols: [i.name, toBn_(i.qty), bnMoney_(i.unitPrice, sym), bnMoney_(i.lineTotal, sym)],
        size: 11
      });
    });
    rows.push({ rule: true });

    var discount = Number(inv.discount) || 0;
    var paid = Number(inv.paidAmount) || 0;
    var due = Number(inv.dueAmount) || 0;
    var grand = Number(inv.grandTotal) || 0;

    kvBn(BN.subtotal, bnMoney_(inv.subtotal, sym), 12);
    if (discount > 0) kvBn(BN.discount, '− ' + bnMoney_(discount, sym), 12);
    kvBn(BN.grandTotal, bnMoney_(grand, sym), 14, true);
    if (paid > 0) kvBn(BN.paid, '− ' + bnMoney_(paid, sym), 12);
    if (due > 0) kvBn(BN.due, bnMoney_(due, sym), 13, true);

    var words = bnAmountInWords_(grand);
    if (words) rows.push({ text: 'কথায়ঃ ' + words, size: 10.5, align: 'center', color: '#555' });
    if (!inv.isDraft && due === 0 && grand > 0) rows.push({ text: 'PAID', size: 13, bold: true, align: 'center', color: '#12805c' });

    try {
      var methods = JSON.parse(shop.paymentMethods || '[]');
      if (Array.isArray(methods) && methods.length) {
        rows.push({ rule: true, thin: true });
        rows.push({
          text: methods.map(function (m) { return (m.label || '') + (m.value ? ' ' + m.value : ''); }).join('   |   '),
          size: 10.5, align: 'center', color: '#555'
        });
      }
    } catch (e) {}

    try {
      var terms = JSON.parse(shop.terms || '[]');
      if (Array.isArray(terms) && terms.length) {
        rows.push({ rule: true, thin: true });
        terms.forEach(function (t) { rows.push({ text: '• ' + (t.text || t), size: 10, color: '#555' }); });
      }
    } catch (e) {}

    if (shop.showSignature) {
      rows.push({ rule: true });
      rows.push({ cols2: ['ক্রেতার স্বাক্ষর', 'বিক্রেতার স্বাক্ষর'], size: 10.5 });
    }

    if (shop.footer) {
      rows.push({ rule: true });
      rows.push({ text: shop.footer, size: 11, align: 'center', color: '#555' });
    }

    // Wrapped rows need measuring before the final canvas height is known.
    // Use a tiny throwaway canvas only for text metrics; the receipt itself is
    // still drawn once on the final canvas below.
    var measureCanvas = document.createElement('canvas');
    var measureCtx = measureCanvas.getContext('2d');
    rows.forEach(function (r) {
      if (!r.wrap || r.text === undefined) return;
      measureCtx.font = (r.bold ? 'bold ' : '') + (r.size || 12) + 'px ' + RECEIPT_FONT_STACK;
      r.lines = wrapCanvasText_(measureCtx, r.text, W - PAD * 2);
    });

    // 1.95 rather than the old 1.7: Bangla stacks matras above the headline
    // and below the baseline, so 1.7 clipped descenders like ু and ৃ.
    var rowHeights = rows.map(function (r) {
      if (r.rule) return r.thin ? 8 : 16;
      if (r.logo) return 60;
      var lineHeight = Math.round((r.size || 12) * 1.95);
      return r.lines ? lineHeight * Math.max(1, r.lines.length) : lineHeight;
    });
    var totalHeight = rowHeights.reduce(function (a, b) { return a + b; }, 0) + PAD * 2;

    var canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = totalHeight * scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, totalHeight);
    ctx.textBaseline = 'middle';

    var colW = [(W - PAD * 2) * 0.40, (W - PAD * 2) * 0.15, (W - PAD * 2) * 0.21, (W - PAD * 2) * 0.24];
    var aligns = ['left', 'center', 'right', 'right'];
    var cy = PAD;

    function setFont(size, bold) {
      ctx.font = (bold ? 'bold ' : '') + size + 'px ' + RECEIPT_FONT_STACK;
    }

    rows.forEach(function (r, idx) {
      var h = rowHeights[idx];
      if (r.rule) {
        ctx.strokeStyle = '#999';
        ctx.lineWidth = r.thin ? 0.5 : 1;
        ctx.beginPath();
        ctx.moveTo(PAD, cy + h / 2);
        ctx.lineTo(W - PAD, cy + h / 2);
        ctx.stroke();
      } else if (r.logo) {
        var maxH = h - 10, maxW = W - PAD * 2;
        var ratio = Math.min(maxH / logoImg.height, maxW / logoImg.width, 1);
        var dw = logoImg.width * ratio, dh = logoImg.height * ratio;
        ctx.drawImage(logoImg, (W - dw) / 2, cy + (h - dh) / 2, dw, dh);
      } else if (r.cols2) {
        setFont(r.size, false);
        ctx.fillStyle = '#111';
        ctx.textAlign = 'left';
        ctx.fillText(r.cols2[0], PAD, cy + h / 2);
        ctx.textAlign = 'right';
        ctx.fillText(r.cols2[1], W - PAD, cy + h / 2);
      } else if (r.cols) {
        setFont(r.size, r.bold);
        ctx.fillStyle = r.bold ? '#111' : '#222';
        var x = PAD;
        r.cols.forEach(function (text, ci) {
          ctx.textAlign = aligns[ci];
          var tx = aligns[ci] === 'left' ? x : (aligns[ci] === 'center' ? x + colW[ci] / 2 : x + colW[ci]);
          ctx.fillText(truncateToWidth_(ctx, String(text), colW[ci] - 4), tx, cy + h / 2);
          x += colW[ci];
        });
      } else if (r.kv) {
        setFont(r.size, r.bold);
        ctx.fillStyle = '#111';
        ctx.textAlign = 'left';
        ctx.fillText(truncateToWidth_(ctx, String(r.kv[0]), (W - PAD * 2) * 0.52), PAD, cy + h / 2);
        ctx.textAlign = 'right';
        ctx.fillText(truncateToWidth_(ctx, String(r.kv[1]), (W - PAD * 2) * 0.46), W - PAD, cy + h / 2);
      } else if (r.text !== undefined) {
        setFont(r.size || 12, r.bold);
        ctx.fillStyle = r.color || '#111';
        ctx.textAlign = r.align || 'left';
        var tx2 = r.align === 'center' ? W / 2 : (r.align === 'right' ? W - PAD : PAD);
        if (r.lines && r.lines.length) {
          var lineHeight = Math.round((r.size || 12) * 1.95);
          r.lines.forEach(function (line, li) {
            ctx.fillText(line, tx2, cy + lineHeight * li + lineHeight / 2);
          });
        } else {
          ctx.fillText(r.text, tx2, cy + h / 2);
        }
      }
      cy += h;
    });

    return canvas;
  }

  /**
   * Bengali is a complex script: a cluster like ক্ষ is consonant + virama (্)
   * + consonant, and vowel signs (া ি ু ে ো) are separate code points that
   * attach to the consonant before them. Cutting a string at an arbitrary
   * index can therefore leave a dangling ্ or an orphan vowel sign, which
   * renders as a visibly broken glyph or a dotted-circle placeholder.
   *
   * This backs the cut point up until it lands on a real cluster boundary.
   */
  function bnSafeCut_(text, n) {
    var i = Math.max(0, Math.min(n, text.length));
    while (i > 0) {
      var prev = text.charCodeAt(i - 1);
      var here = i < text.length ? text.charCodeAt(i) : 0;
      var prevIsVirama = prev === 0x09CD;                       // hasant — binds to the NEXT consonant
      var prevIsJoiner = prev === 0x200D || prev === 0x200C;    // ZWJ / ZWNJ
      var hereIsMark =
        (here >= 0x0981 && here <= 0x0983) ||                   // candrabindu, anusvara, visarga
        here === 0x09BC ||                                      // nukta
        (here >= 0x09BE && here <= 0x09C4) ||                   // vowel signs
        (here >= 0x09C7 && here <= 0x09C8) ||
        (here >= 0x09CB && here <= 0x09CD) ||                   // incl. virama
        here === 0x09D7 ||
        (here >= 0x09E2 && here <= 0x09E3);
      if (!prevIsVirama && !prevIsJoiner && !hereIsMark) break;
      i--;
    }
    return text.slice(0, i);
  }

  function truncateToWidth_(ctx, text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    var cut = text.length;
    while (cut > 1) {
      cut--;
      var candidate = bnSafeCut_(text, cut);
      if (!candidate) break;
      if (ctx.measureText(candidate + '…').width <= maxWidth) return candidate + '…';
      cut = candidate.length;   // skip the whole cluster we just rejected
    }
    return '…';
  }

  /* =====================================================================
   * 9. Refresh, delete, and range printing - the shared layer
   *
   * These three jobs were wanted on every module. Rather than paste the
   * same markup and handler into fifteen page files, each page registers
   * one function here and gets all three behaviours for free. A new page
   * added later needs a single registerPageReload() line.
   * ===================================================================*/

  // ---------------- Refresh ----------------
  // pageKey -> the function that reloads that page's data.
  var pageReloaders_ = {};

  /**
   * Lets a page say "this is how you reload me". The topbar Refresh button
   * then works on that page with no further wiring, and so does any code
   * that needs to force a reload after a delete.
   */
  function registerPageReload(pageKey, fn) {
    if (typeof fn === 'function') pageReloaders_[pageKey] = fn;
  }

  /** Reloads whichever page is on screen. Wired to the topbar Refresh button. */
  function refreshCurrentPage() {
    var fn = pageReloaders_[currentPage];
    if (!fn) { showToast('Nothing to refresh on this page.', 'info'); return; }
    var btn = document.getElementById('refreshBtn');
    if (btn) btn.classList.add('spinning');
    try {
      var result = fn();
      // A loader that returns a promise lets us stop the spinner at the
      // right moment; one that returns nothing just spins briefly.
      if (result && typeof result.then === 'function') {
        result.then(function () { stopRefreshSpin_(); showToast('Refreshed.', 'success'); })
              .catch(function () { stopRefreshSpin_(); });
      } else {
        setTimeout(function () { stopRefreshSpin_(); showToast('Refreshed.', 'success'); }, 400);
      }
    } catch (e) {
      stopRefreshSpin_();
      showToast(e.message || 'Could not refresh.', 'error');
    }
  }

  function stopRefreshSpin_() {
    var btn = document.getElementById('refreshBtn');
    if (btn) btn.classList.remove('spinning');
  }

  /** Reloads a page's data without the toast - used after a successful delete. */
  function reloadPage_(pageKey) {
    var fn = pageReloaders_[pageKey];
    if (fn) try { fn(); } catch (e) { /* the page will show its own error */ }
  }


  // ---------------- Delete compatibility ----------------
  // Existing modules keep calling confirmDelete(opts); this adapter routes
  // every one of those calls through the global danger confirmation while
  // preserving the exact native delete RPC and mandatory audit reason.
  function legacyDeleteSummaryText_(html) {
    if (!html) return '';
    var el = document.createElement('div');
    el.innerHTML = String(html);
    return String(el.textContent || el.innerText || '').replace(/\s+/g, ' ').trim();
  }

  function confirmDelete(opts) {
    var o = opts || {};
    var summaryText = legacyDeleteSummaryText_(o.summary || '');
    var details = Array.isArray(o.details) ? o.details.slice() : [];
    if (!details.length && summaryText) details.push({ label: 'Record', value: summaryText, emphasis: true });
    var promise = runConfirmedAction({
      type: 'danger',
      title: o.title || 'Delete record?',
      message: o.message || 'This action will reverse or remove the related record effects.',
      details: details,
      confirmLabel: o.confirmLabel || 'Delete',
      loadingLabel: o.loadingLabel || 'Deleting...',
      reason: {
        required: true,
        label: o.reasonLabel || 'Reason',
        placeholder: o.reasonPlaceholder || 'e.g. entered twice by mistake',
        maxLength: 200
      },
      trigger: o.trigger || document.activeElement
    }, function (reason) {
      var args = [o.fn, authToken].concat(o.args || [], [reason]);
      return withLoader(serverCall.apply(null, args)).then(function (res) {
        showToast(o.successMessage || 'Deleted. Stock and balances have been reversed.', 'success');
        (o.reloadPages || [currentPage]).forEach(reloadPage_);
        if (typeof o.onDone === 'function') o.onDone(res);
        return res;
      });
    });
    promise.catch(function (err) {
      showToast(err && err.message ? err.message : 'Delete failed.', 'error');
    });
    return promise;
  }

  // ---------------- Date-range printing ----------------
  /**
   * Prints any ledger for the selected range. Builds a clean standalone
   * document rather than printing the app shell, which is what caused the
   * two-page invoice bug - the sidebar and modals carry layout height even
   * when hidden.
   */
  function printLedgerRange(opts) {
    var o = opts || {};
    var host = document.getElementById('printHost');
    if (!host) return;
    var head = (o.columns || []).map(function (c) { return '<th>' + escapeHtml(c.label) + '</th>'; }).join('');
    var body = (o.rows || []).map(function (r) {
      return '<tr>' + (o.columns || []).map(function (c) {
        var v = typeof c.value === 'function' ? c.value(r) : r[c.key];
        return '<td' + (c.align ? ' style="text-align:' + c.align + '"' : '') + '>' +
               (c.raw ? (v == null ? '' : v) : escapeHtml(v == null ? '' : String(v))) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    host.innerHTML =
      // Wrapped in .invoice-paper so it inherits the print stylesheet that
      // already exists, and driven by the same body.printing-invoice class
      // that fixed the blank-second-page bug. No new print CSS needed.
      '<div class="invoice-paper">' +
        '<h2 class="ledger-print-title">' + escapeHtml(o.title || 'Ledger') + '</h2>' +
        '<div class="ledger-print-meta">' + escapeHtml(o.subtitle || '') + '</div>' +
        '<table class="ledger-print-table"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>' +
        (o.footer ? '<div class="ledger-print-total">' + o.footer + '</div>' : '') +
      '</div>';
    document.body.classList.add('printing-invoice');
    try {
      window.print();
    } finally {
      document.body.classList.remove('printing-invoice');
      host.innerHTML = '';
    }
  }

  /**
   * Exports any table to a downloaded CSV file. Same { columns, rows }
   * shape printLedgerRange takes, so a page that already builds columns
   * for printing gets export for free with the same column list.
   * opts = { filename, columns: [{ key, label, value? }], rows }
   */
  function exportRowsToCsv(opts) {
    var o = opts || {};
    var cols = o.columns || [];
    function csvCell_(v) {
      var s = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = [cols.map(function (c) { return csvCell_(c.label); }).join(',')];
    (o.rows || []).forEach(function (r) {
      lines.push(cols.map(function (c) {
        var v = typeof c.value === 'function' ? c.value(r) : r[c.key];
        return csvCell_(v == null ? '' : v);
      }).join(','));
    });
    // Leading BOM so Excel opens UTF-8 (Bangla text, currency symbols) correctly.
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (o.filename || 'export') + '.csv';
    a.click();
  }

  /** Reads a From/To pair and returns {dateFrom,dateTo}, validating the order. */
  function readDateRange(fromId, toId) {
    var from = (document.getElementById(fromId) || {}).value || '';
    var to = (document.getElementById(toId) || {}).value || '';
    if (from && to && from > to) {
      showToast('The "from" date is after the "to" date.', 'error');
      return null;
    }
    return { dateFrom: from, dateTo: to };
  }


  /* ---------------- Dedicated Customer/Supplier Ledger workspaces ---------------- */
  var partyLedgerPendingOpen_ = { customer: '', supplier: '' };

  function openCustomerLedger_(customerId) {
    partyLedgerPendingOpen_.customer = String(customerId || '');
    goToPage('customerLedger');
  }

  function openSupplierLedger_(supplierId) {
    partyLedgerPendingOpen_.supplier = String(supplierId || '');
    goToPage('supplierLedger');
  }

  document.addEventListener('click', function (e) {
    var customerLink = e.target.closest && e.target.closest('[data-customer-ledger-id]');
    if (customerLink) {
      e.preventDefault();
      openCustomerLedger_(customerLink.dataset.customerLedgerId || '');
      return;
    }
    var supplierLink = e.target.closest && e.target.closest('[data-supplier-ledger-id]');
    if (supplierLink) {
      e.preventDefault();
      openSupplierLedger_(supplierLink.dataset.supplierLedgerId || '');
    }
  });

  /**
   * Route ledger-source actions into the ERP's native modules. This function
   * contains no accounting mutation logic; it only navigates/orchestrates the
   * already-authoritative handlers.
   */
  function partyLedgerRouteSourceAction_(kind, row, action, refreshFn) {
    row = row || {};
    action = String(action || '');

      let syncing = false;

        const overflow = Math.max(0, content.scrollWidth - content.clientWidth);
        if (overflow <= 1) {
          bar.hidden = true;
          return;

        syncing = true;
